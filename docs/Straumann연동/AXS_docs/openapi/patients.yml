openapi: 3.0.1
info:
  title: Patients
  version: v1
  description: "The Straumann AXS\xAE Patients enables you to create and manage the\
    \ patient journey."
  license:
    name: Straumann
    url: https://axs.straumann.com
servers:
- url: https://ppr.api.us.axs.straumann.com
  description: Pre-production - US region
- url: https://ppr.api.eu.axs.straumann.com
  description: Pre-production - EU region
- url: https://api.us.axs.straumann.com
  description: Production - US region
- url: https://api.eu.axs.straumann.com
  description: Production - EU region
security:
- bearerAuth: []
- httpBasic: []
paths:
  /v1/patients:
    post:
      tags:
      - Patients
      summary: Create a new Patient
      description: This endpoint allows authorized users to create new patient records
        in AXS.
      operationId: createPatient
      parameters:
      - in: header
        name: Organization-ID
        schema:
          type: string
          format: uuid
        required: true
        description: ID of the customer organization for which the data belongs to.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreationPublicRequestDTO'
        required: true
      responses:
        '201':
          description: Patient record created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientPublicDTO'
              example:
                id: b3a0ec90-2c6c-11ee-be56-0242ac120002
                customPatientId: P1744804721
                firstName: John
                middleName: Alexander
                lastName: Doe
                gender: MALE
                birthDate: '1990-08-15'
                issuingAuthority: SIRIOS
                uniqueHealthIdentifier: 2 39 08 88 154 002 43
                createdOn: '2025-04-21T10:15:30Z'
        '400':
          description: Invalid value passed for one or more fields. Please check the
            error message for details.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                type: https://docs.straumann.com/errors/validation
                title: Bad Request
                status: 400
                detail: 'Invalid value ''NOT KNOWN'' for field ''gender''. Allowed
                  values are: [MALE, FEMALE, OTHER, UNKNOWN]'
                instance: /public/v1/patients
                messageKey: VALIDATION_ERROR
                occurredAt: '2026-02-17T11:02:45.026Z'
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                status: 401
                reason: Unauthorized
                message: Invalid or expired access token.
        '403':
          description: "Forbidden \u2013 Access denied due to insufficient permissions."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                type: https://docs.straumann.com/errors/forbidden
                title: Forbidden
                status: 403
                detail: Consent has not been granted for Organization ID:eg473132-106f-4745-9509-839e3539e6c8
                instance: /public/v1/patients
                messageKey: FORBIDDEN
                occurredAt: '2026-02-17T11:02:45.026Z'
        '500':
          description: Internal Server Error - Unexpected error occurred. Please try
            again.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                type: https://docs.straumann.com/errors/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred while processing your request.
                  Please try again later or contact support if the problem persists.
                instance: /public/v1/patients
                messageKey: INTERNAL_SERVER_ERROR
                occurredAt: '2026-02-17T11:02:45.026Z'
  /v1/patients/{id}:
    get:
      tags:
      - Patients
      summary: Get Patient details by ID
      description: Fetch detailed information of a patient using their unique ID.
      operationId: getPatient
      parameters:
      - in: header
        name: Organization-ID
        schema:
          type: string
          format: uuid
        required: true
        description: ID of the customer organization for which the data belongs to.
      - name: id
        in: path
        description: Unique identifier for the patient.
        required: true
        schema:
          type: string
          format: uuid
          example: b3a0ec90-2c6c-11ee-be56-0242ac120002
      responses:
        '200':
          description: Patient details retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PatientPublicDTO'
        '400':
          description: Invalid value passed for one or more fields. Please check the
            error message for details.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              examples:
                invalidId:
                  summary: Invalid UUID format
                  value:
                    type: https://docs.straumann.com/errors/validation
                    title: Bad Request
                    status: 400
                    detail: 'Invalid value ''fcb7fd24-0db3-4cef-b1c5-007dcb9d264bsdgiusgh''
                      for parameter ''id''. Expected type: UUID'
                    instance: /public/v1/patients/fcb7fd24-0db3-4cef-b1c5-007dcb9d264bsdgiusgh
                    messageKey: VALIDATION_ERROR
                    occurredAt: '2026-02-17T12:22:45.329Z'
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              examples:
                unauthorized:
                  summary: Missing token
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is missing or invalid.
                expired:
                  summary: Expired token
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is expired.
        '403':
          description: "Forbidden \u2013 Access denied due to insufficient permissions."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                type: https://docs.straumann.com/errors/forbidden
                title: Forbidden
                status: 403
                detail: Consent has not been granted for Organization ID:eg473132-106f-4745-9509-839e3539e6c8
                instance: /public/v1/patients
                messageKey: FORBIDDEN
                occurredAt: '2026-02-17T11:02:45.026Z'
        '404':
          description: "Not Found \u2013 No patient found with the given ID."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              examples:
                notFound:
                  summary: Patient not found
                  value:
                    type: https://docs.straumann.com/errors/not-found
                    title: Not Found
                    status: 404
                    detail: PatientId with 'fcb7fd24-0db3-4cef-b1c5-007dcb9d264b'
                      was not found.
                    instance: /public/v1/patients/fcb7fd24-0db3-4cef-b1c5-007dcb9d264b
                    messageKey: RESOURCE_NOT_FOUND
                    occurredAt: '2026-02-17T12:18:46.685Z'
        '413':
          description: "Payload Too Large \u2013 Input size exceeded limit."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              examples:
                payloadTooLarge:
                  summary: Oversized request
                  value:
                    status: 413
                    reason: Payload Too Large
                    message: Request header or path exceeded allowed size limit.
        '500':
          description: "Internal Server Error \u2013 Unexpected error occurred. Please\
            \ try again."
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
              example:
                type: https://docs.straumann.com/errors/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred while processing your request.
                  Please try again later or contact support if the problem persists.
                instance: /public/v1/patients
                messageKey: INTERNAL_SERVER_ERROR
                occurredAt: '2025-12-18T10:00:00.000Z'
    patch:
      tags:
      - Patients
      summary: Update Patient details
      description: 'Updates the specified Patient object by setting the values of
        the parameters passed. Any parameters not provided will be left unchanged.

        This API is useful for updating selective fields such as firstName, lastName,
        or demographic details  without requiring a full update payload.'
