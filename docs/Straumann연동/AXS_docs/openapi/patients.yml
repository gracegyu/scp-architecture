components:
  securitySchemes:
    httpBasic:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OAuth2:
      type: object
    ErrorDTO:
      type: object
      description: RFC 7807 compliant error response structure for all API error responses.
        This standardized format provides detailed information about errors.
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: https://docs.straumann.com/errors/validation
        title:
          type: string
          description: A short summary of the problem type.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem.
          example: 400
        detail:
          type: string
          description: An error explanation specific to this occurrence of the problem.
            This field provides  context-specific information about what went wrong,
            such as which field failed validation and why.
          example: 'Validation failed for field ''customPatientId'': special characters
            and spaces are not allowed and has minimum 2 characters'
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of
            the problem. This is typically the request URI  that caused the error.
          example: /public/v1/patients
        messageKey:
          type: string
          description: Error code that can be used for internationalization, logging,
            or automated error handling.  This key remains consistent for the same
            error type and can be used to look up localized error messages.
          example: VALIDATION_ERROR
        occurredAt:
          type: string
          description: Timestamp when the error occurred in ISO 8601 format.
          example: '2026-02-17T13:33:45.071Z'
    PatientPublicDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique system-generated identifier for the patient (UUID).
          example: b3a0ec90-2c6c-11ee-be56-0242ac120002
        customPatientId:
          type: string
          description: Custom Identifier provided or system generated (if not provided)
            during patient creation.
          example: P1744804721
        firstName:
          type: string
          description: Patient's first name.
          example: John
        middleName:
          type: string
          description: Patient's middle name.
          example: Alexander
        lastName:
          type: string
          description: Patient's last name.
          example: Doe
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
          - UNKNOWN
          example: MALE
        birthDate:
          type: string
          format: date
          description: Patient's date of birth in ISO format (YYYY-MM-DD).
          example: '1990-08-15'
        issuingAuthority:
          type: string
          description: "Authorized entity or organization responsible for issuing\
            \ or validating the patient\u2019s identifier."
          example: SIRIOS
        uniqueHealthIdentifier:
          type: string
          description: Unique health identifier assigned by concerned authority. Applicable
            for FRANCE users.
          example: 2 39 08 88 154 002 43
        dataConsent:
          type: boolean
          description: Indicates whether the patient has provided consent for storing
            and using their health data.
          example: 'true'
        createdOn:
          type: string
          format: date-time
          description: Date and time when the patient record was created
          example: '2025-04-21T10:15:30Z'
    PatientCreationPublicRequestDTO:
      type: object
      required:
      - customPatientId
      - dataConsent
      properties:
        firstName:
          type: string
          description: Patient's first name.
          example: John
        middleName:
          type: string
          description: Patient's middle name.
          example: Alexander
        lastName:
          type: string
          description: Patient's last name.
          example: Doe
        birthDate:
          type: string
          format: date
          description: Patient's date of birth in ISO format (YYYY-MM-DD).
          example: '1990-08-15'
        customPatientId:
          type: string
          description: Custom Identifier provided or system generated (if not provided)
            during patient creation.
          example: P1744804721
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
          - UNKNOWN
        issuingAuthority:
          type: string
          description: "Authorized entity or organization responsible for issuing\
            \ or validating the patient\u2019s identifier."
          example: SIRIOS
        uniqueHealthIdentifier:
          type: string
          description: Unique health identifier assigned by concerned authority. Applicable
            for FRANCE users.
          example: 2 39 08 88 154 002 43
        dataConsent:
          type: boolean
          description: Indicates whether the patient has provided explicit consent
            for storing, processing, and using their personal health data.
          example: true
    PatientUpdatePublicRequestDTO:
      type: object
      description: Request body for updating patient information. All fields are optional
        - only include fields that need to be updated. Fields not included in the
        request will remain unchanged.
      properties:
        firstName:
          type: string
          description: Patient's first name.
          example: John
        lastName:
          type: string
          description: Patient's last name.
          example: Doe
        middleName:
          type: string
          description: Patient's middle name.
          example: Alexander
        birthDate:
          type: string
          format: date
          description: Patient's date of birth in ISO format (YYYY-MM-DD). Must be
            a valid past date, cannot be a future date.
          example: '1990-08-15'
        uniqueHealthIdentifier:
          type: string
          description: Unique health identifier assigned by concerned authority. Applicable
            for FRANCE users.
          example: 2 39 08 88 154 002 43
        gender:
          type: string
          description: Patient's gender.
          enum:
          - MALE
          - FEMALE
          - OTHER
          - UNKNOWN
          example: MALE
    PatientPublicSearchRequestDTO:
      type: object
      description: Search criteria for finding patient records. All search fields
        are optional and can be combined for more specific searches. Supports pagination
        and sorting.
      properties:
        offset:
          type: integer
          format: int32
          description: Number of records to skip for pagination. Must be greater than
            or equal to 0.
          minimum: 0
          example: 0
        limit:
          type: integer
          format: int32
          description: Maximum number of records to return per page. Must be between
            0 and 30.
          minimum: 0
          maximum: 30
          example: 30
        sortBy:
          type: string
          description: Field name to sort the results by.
          enum:
          - CUSTOM_PATIENT_ID
          - PATIENT_FIRST_NAME
          - PATIENT_LAST_NAME
          example: PATIENT_LAST_NAME
        sortDirection:
          type: string
          description: Sort direction for the results.
          enum:
          - ASC
          - DESC
          example: ASC
        keyword:
          type: string
          description: General keyword search that searches across multiple fields
            (firstName, lastName, customPatientId). Use this for broad searches when
            you don't know which specific field contains the value.
          example: John
        customPatientId:
          type: string
          description: Search by the exact or partial custom patient identifier.
          example: P1744804721
        firstName:
          type: string
          description: Search by patient's first name. Supports partial matches.
          example: John
        lastName:
          type: string
          description: Search by patient's last name. Supports partial matches.
          example: Doe
        birthDate:
          type: string
          format: date
          description: Search by exact birth date in ISO format (YYYY-MM-DD).
          example: '1990-08-15'
    PatientPublicSearchResultDTO:
      type: object
      description: Individual patient record returned in search results.
      required:
      - customPatientId
      - lastName
      properties:
        id:
          type: string
          format: uuid
          description: Unique system-generated identifier for the patient (UUID).
          example: b3a0ec90-2c6c-11ee-be56-0242ac120002
        customPatientId:
          type: string
          description: Custom identifier provided or system-generated (if not provided)
            during patient creation.
          minLength: 2
          example: P1744804721
        firstName:
          type: string
          description: Patient's first name.
          example: John
        middleName:
          type: string
          description: Patient's middle name.
          example: Alexander
        lastName:
          type: string
          description: Patient's last name.
          example: Doe
        birthDate:
          type: string
          format: date
          description: Patient's date of birth in ISO format (YYYY-MM-DD).
          example: '1990-08-15'
        dataConsent:
          type: boolean
          description: Indicates whether the patient has provided consent for storing
            and using their health data.
          example: true
    PatientPublicSearchResponseDTO:
      type: object
      description: Response containing paginated search results for patient records.
      required:
      - patients
      - offset
      - limit
      - total
      properties:
        patients:
          type: array
          description: List of patient records matching the search criteria.
          items:
            $ref: '#/components/schemas/PatientPublicSearchResultDTO'
        offset:
          type: integer
          format: int32
          description: The offset value used in the search request, indicating the
            number of records skipped.
          example: 0
        limit:
          type: integer
          format: int32
          description: The maximum number of records returned per page (up to 30).
          maximum: 30
          example: 10
        total:
          type: integer
          format: int32
          description: Total number of patient records matching the search criteria,
            regardless of pagination.
          example: 30
    PatientDocumentPublicUploadRequestDTO:
      type: object
      description: Request body for creating a document placeholder for a patient.
        This creates a record in the system and returns a storage URL where the actual
        file can be uploaded.
      required:
      - fileName
      properties:
        fileName:
          type: string
          description: Name of the document file to be uploaded. Must be a valid filename
            with a proper extension.
          minLength: 1
          example: Patient_Xray_2024.ply
        path:
          type: string
          format: string
          description: File path to save the document within the patient's directory.
            Use '/' to denote folder levels. Only allowed special characters are '-'
            and '_'. If not provided, the document will be saved at the root level
            of the patient's directory.
          example: /Folder/Subfolder
    PatientDocumentPublicUploadResponseDTO:
      type: object
      description: Response after creating a document placeholder. Contains the document
        ID and a storage URL where the file content should be uploaded.
      properties:
        id:
          type: string
          description: Unique identifier for the document record created in the system.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        storageUrl:
          type: string
          description: Pre-signed URL for uploading the actual file content to cloud
            storage. This URL is time-limited and should be used immediately.
          format: uri
          example: https://storage.example.com/upload/patient-documents/3fa85f64-5717-4562-b3fc-2c963f66afa6?signature=xyz
        path:
          type: string
          format: string
          description: File path where the document is stored within the patient's
            directory. This reflects the path provided during upload request or default
            root if not provided.
          example: /Folder/Subfolder
    PatientDocumentPublicUpdateRequestDTO:
      type: object
      description: Request body for updating document metadata, such as renaming the
        file.
      required:
      - fileName
      properties:
        fileName:
          type: string
          description: New name for the document file. Must contain a valid file extension
            preceded by a dot. Allowed characters are letters, numbers, underscore,
            spaces, apostrophes, parentheses, and hyphens. Maximum length is 140 characters.
          minLength: 1
          maxLength: 140
          pattern: ^[\p{L}\p{M}\p{N}0-9_ '()-]+\\*[.]{1}[a-zA-Z0-9]+$
          example: Patient_Document_Updated.ply
    PatientDocumentPublicSearchRequestDTO:
      type: object
      description: Search criteria for finding patient documents. All search fields
        are optional and support pagination, sorting, and filtering.
      properties:
        offset:
          type: integer
          format: int32
          description: Number of records to skip for pagination. Must be greater than
            or equal to 0.
          minimum: 0
          example: 0
        limit:
          type: integer
          format: int32
          description: Maximum number of records to return per page. Must be between
            0 and 30.
          minimum: 0
          maximum: 30
          example: 10
        id:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 30
          description: Filter documents by specific document IDs. Accepts multiple
            UUIDs to retrieve specific documents in a single request. Maximum of 30
            document IDs can be provided per request.
          example:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          - 7ba92c81-4821-5673-c4ed-3d074g77bgb7
        fileName:
          type: string
          description: Search by document file name. Supports partial matches for
            flexible searching.
          example: Upper_Jaw.stl
        fileType:
          type: string
          description: Filter by specific file type/extension. Use the file type enum
            values (e.g., PDF, JPG, STL).
          example: STL
        hasContent:
          type: boolean
          description: Filter documents based on whether they have content uploaded
            (true) or return all documents under patient if passed false.
          example: true
        sortBy:
          type: string
          description: Field name to sort the results by (e.g., fileName, lastModifiedAt).
          example: lastModifiedAt
        sortDirection:
          type: string
          description: Sort direction for the results.
          enum:
          - ASC
          - DESC
          example: DESC
        path:
          type: string
          format: string
          description: File path to search within the patient's directory. Use '/'
            to denote folder levels and ensure it starts with '/'. Only allowed special
            characters are '-' and '_'.
          example: /Folder/Subfolder
    PatientDocumentPublicSearchResponseDTO:
