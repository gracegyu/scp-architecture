openapi: 3.0.1
info:
  title: Webhook System
  version: v1
  description: "The Straumann AXS\xAE Webhook System enables you to manage subscriptions\
    \ to AXS-related events and receive notifications via user-defined callback URLs.\n"
servers:
- url: https://ppr.api.us.axs.straumann.com
  description: Pre-production - US region
- url: https://ppr.api.eu.axs.straumann.com
  description: Pre-production - EU region
- url: https://api.us.axs.straumann.com
  description: Production - US region
- url: https://api.eu.axs.straumann.com
  description: Production - EU region
security:
- bearerAuth: []
- httpBasic: []
paths:
  /v1/webhook/subscribe:
    post:
      tags:
      - Subscription
      summary: Register a new webhook subscription
      description: 'Registers a subscription with the Webhook server, allowing third-party
        systems to receive event notifications. Clients specify which events they
        want to subscribe to and provide a callback URL for delivery.

        '
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateSubscriptionRequestDTO'
      responses:
        '201':
          description: Subscription created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreateSubscriptionResponseDTO'
        '400':
          description: Invalid request payload or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                invalidPayload:
                  summary: Malformed request
                  value:
                    status: 400
                    reason: Bad Request
                    message: One or more required fields are missing or invalid.
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                missingAuthToken:
                  summary: Token missing
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is missing or invalid.
        '403':
          description: Access forbidden due to insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                forbiddenAccess:
                  summary: Insufficient privileges
                  value:
                    status: 403
                    reason: Forbidden
                    message: You do not have permission to perform this action.
        '404':
          description: Requested resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                resourceNotFound:
                  summary: Subscription missing
                  value:
                    status: 404
                    reason: Not Found
                    message: The specified subscription ID does not exist.
        '409':
          description: Conflict detected with existing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                conflictError:
                  summary: Duplicate subscription
                  value:
                    status: 409
                    reason: Conflict
                    message: A subscription with similar parameters already exists.
        '413':
          description: Request payload exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                payloadTooLarge:
                  summary: Data overload
                  value:
                    status: 413
                    reason: Payload Too Large
                    message: The size of the request payload exceeds the allowed limit.
        '500':
          description: Unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                serverCrash:
                  summary: Internal failure
                  value:
                    status: 500
                    reason: Internal Server Error
                    message: An unexpected error occurred on the server.
  /v1/webhook/{subscriptionId}:
    delete:
      tags:
      - Subscription
      summary: Remove an existing webhook subscription
      description: 'Deletes a previously registered subscription identified by its
        unique Subscription ID. This stops any future event notifications for that
        subscription.

        '
      operationId: deleteSubscriptionById
      parameters:
      - name: subscriptionId
        in: path
        description: Unique ID of the subscription to delete.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subscription created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeleteSubscriptionResponseDTO'
              examples:
                invalidSubscriptionId:
                  summary: Successfully Deleted Subscription
                  value:
                    message: Subscription With ID a123bc-de4346f-gh798k Deleted
        '400':
          description: Invalid subscription ID or malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                invalidSubscriptionId:
                  summary: Malformed subscription ID
                  value:
                    status: 400
                    reason: Bad Request
                    message: The subscription ID format is invalid.
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                missingAuthToken:
                  summary: Token missing
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is missing or invalid.
        '403':
          description: Operation forbidden due to insufficient privileges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                forbiddenDelete:
                  summary: No delete access
                  value:
                    status: 403
                    reason: Forbidden
                    message: Your role does not allow deletion of subscriptions.
        '404':
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                subscriptionNotFound:
                  summary: ID not found
                  value:
                    status: 404
                    reason: Not Found
                    message: No subscription matches the provided ID.
        '409':
          description: Conflict detected while deleting the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                deleteConflict:
                  summary: Inconsistent state
                  value:
                    status: 409
                    reason: Conflict
                    message: The subscription could not be deleted due to a conflict.
        '413':
          description: Request payload exceeds allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                excessivePayload:
                  summary: Oversized request
                  value:
                    status: 413
                    reason: Payload Too Large
                    message: The request payload is too large for processing.
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                deletionServerError:
                  summary: Deletion failure
                  value:
                    status: 500
                    reason: Internal Server Error
                    message: An error occurred while attempting to delete the subscription.
    patch:
      tags:
      - Subscription
      summary: Update an existing webhook subscription
      description: 'Updates the list of events for an existing subscription. Clients
        can add new event topics to an active subscription by providing the subscription
        ID. Updates are blocked for non-existent or deleted subscriptions.

        '
      operationId: updateSubscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Unique identifier of the subscription to update.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateSubscriptionRequestDTO'
      responses:
        '200':
          description: Subscription updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookUpdateSubscriptionResponseDTO'
        '400':
          description: Invalid request payload or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                invalidPayload:
                  summary: Malformed request
                  value:
                    status: 400
                    reason: Bad Request
                    message: One or more required fields are missing or invalid.
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                missingAuthToken:
                  summary: Token missing
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is missing or invalid.
        '403':
          description: Access forbidden due to insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                forbiddenAccess:
                  summary: Insufficient privileges
                  value:
                    status: 403
                    reason: Forbidden
                    message: You do not have permission to perform this action.
        '404':
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                resourceNotFound:
                  summary: Subscription missing
                  value:
                    status: 404
                    reason: Not Found
                    message: The specified subscription ID does not exist.
        '409':
          description: Conflict detected with existing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                conflictError:
                  summary: Duplicate subscription events
                  value:
                    status: 409
                    reason: Conflict
                    message: The subscription already contains all of the requested
                      events.
        '410':
          description: Subscription is deleted and cannot be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                deletedSubscription:
                  summary: Deleted subscription
                  value:
                    status: 410
                    reason: Gone
                    message: The specified subscription has been deleted and cannot
                      be updated.
        '413':
          description: Request payload exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                payloadTooLarge:
                  summary: Data overload
                  value:
                    status: 413
                    reason: Payload Too Large
                    message: The size of the request payload exceeds the allowed limit.
        '500':
          description: Unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                serverCrash:
                  summary: Internal failure
                  value:
                    status: 500
                    reason: Internal Server Error
                    message: An unexpected error occurred on the server.
  /v1/webhook/events:
    get:
      tags:
      - Events
      summary: Search webhook events
      description: 'Retrieves webhook event notifications that were previously generated
        and stored by the system. Clients can query events within a specific date
        range and optionally filter by event type. This endpoint is typically used
        for auditing, troubleshooting failed deliveries, or replaying webhook events.

        '
      operationId: searchByCriteria
      parameters:
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: eventType
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
      responses:
        '200':
          description: Event notifications retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventsResponseDTO'
        '400':
          description: Invalid request payload or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                invalidPayload:
                  summary: Malformed request
                  value:
                    status: 400
                    reason: Bad Request
                    message: One or more required fields are missing or invalid.
        '401':
          description: "Unauthorized \u2013 Invalid or expired authentication token."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                missingAuthToken:
                  summary: Token missing
                  value:
                    status: 401
                    reason: Unauthorized
                    message: Authentication token is missing or invalid.
        '403':
          description: Access forbidden due to insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                forbiddenAccess:
                  summary: Insufficient privileges
                  value:
                    status: 403
                    reason: Forbidden
                    message: You do not have permission to perform this action.
        '404':
          description: Requested resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                resourceNotFound:
                  summary: Subscription missing
                  value:
                    status: 404
                    reason: Not Found
                    message: The specified subscription ID does not exist.
        '409':
          description: Conflict detected with existing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                conflictError:
                  summary: Duplicate subscription
                  value:
                    status: 409
                    reason: Conflict
                    message: A subscription with similar parameters already exists.
        '413':
          description: Request payload exceeds maximum allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                payloadTooLarge:
                  summary: Data overload
                  value:
                    status: 413
                    reason: Payload Too Large
                    message: The size of the request payload exceeds the allowed limit.
        '500':
          description: Unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                serverCrash:
                  summary: Internal failure
                  value:
                    status: 500
                    reason: Internal Server Error
                    message: An unexpected error occurred on the server.
components:
  securitySchemes:
    httpBasic:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OAuth2:
      type: object
    ErrorDTO:
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
    EventNotificationDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        messageId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        eventType:
          type: string
        organizationId:
          type: string
          format: uuid
        deliveryStatus:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        data:
          type: string
        clientId:
          type: string
          format: uuid
    WebhookCreateSubscriptionRequestDTO:
      required:
      - events
      - callbackUrl
      - hmac
      type: object
      properties:
        events:
          type: array
          items:
            type: string
          description: Events to subscribe to, such as patient creation or updates.
        callbackUrl:
          type: string
          format: uri
          description: HTTPS endpoint where the subscribed events will be sent.
        hmac:
          type: string
          description: HMAC signature for authenticating incoming callbacks.
    WebhookDeleteSubscriptionResponseDTO:
      type: object
      properties:
        message:
          type: string
          description: Outcome status of the deletion
    WebhookCreateSubscriptionResponseDTO:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: Unique identifier assigned to the newly created subscription.
        responseMessage:
          type: string
          description: Outcome status of the subscription creation request.
    WebhookUpdateSubscriptionRequestDTO:
      required:
      - events
      - callbackUrl
      - hmac
      type: object
      properties:
        events:
          type: array
          items:
            type: string
          description: List of new events to subscribe to
    WebhookUpdateSubscriptionResponseDTO:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: Unique identifier of the updated subscription
        responseMessage:
          type: string
          description: Status message about the update
    SearchEventsResponseDTO:
      type: object
      properties:
        currentPageNumber:
          type: integer
          format: int32
        eventList:
          type: array
          items:
            $ref: '#/components/schemas/EventNotificationDTO'
        totalPages:
          type: integer
          format: int32
