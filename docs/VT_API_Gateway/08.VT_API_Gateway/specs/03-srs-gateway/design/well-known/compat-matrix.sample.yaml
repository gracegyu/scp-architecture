# 호환성 매트릭스 — SSOT (사람이 편집하는 원본)
# =====================================================================
# - 이 YAML이 정본. CI가 이 파일로부터 env별 server-configuration.json 을 생성해 S3에 발행한다.
#   (schemaVersion · env · serverVersion · generatedAt 는 CI가 주입 — 여기 적지 않는다)
# - 값 확정: (1) API 호환성 One Pager(VKS)와 동기화. 편집은 PR 리뷰를 거친다.
# - 반응 정책(SRS 7.7.3): major 미달 = 차단 / minor 미달 = 경고 통과(degrade) / patch = 무시.
#   (현 스키마는 minClientVersion 단일값 — tier/경고 필드는 값 확정 후 도입 검토)
# - id 는 불변(경로·버전이 바뀌어도 유지 — 클라이언트 캐시·로깅 추적성).
#   제품명 키(minClientVersion) = Vatech-Product 헤더값과 정확히 일치(CleverOne·EzServer·CleverSpace).
# - errorCode 는 SRS 7.7.4 표준 집합에서만 선택(임의 신설 금지).

apis:
  - id: region.change                       # 리전 변경 API (안정 식별자·불변) — path는 비계약 주석(매칭 키=id)
    path: /v1/admin/clinics/{clinicId}/region
    minClientVersion:
      EzServer: "2.1.0"                      # 이 API는 EzServer 2.1.0+ 필요
    errorCode: COMPAT_CLIENT_TOO_OLD
    fallback: "클라이언트 업데이트가 필요합니다."

  - id: region.set
    path: /v1/clinics/me/region
    minClientVersion:
      CleverOne: "1.2.0"
    errorCode: COMPAT_CLIENT_TOO_OLD
    fallback: "클라이언트 업데이트가 필요합니다."

features:
  - id: presignedUpload
    minClientVersion:
      CleverOne: "1.3.0"
      EzServer: "2.1.0"
    errorCode: COMPAT_FEATURE_UNSUPPORTED
    fallback: "현재 버전에서 지원하지 않는 기능입니다."
