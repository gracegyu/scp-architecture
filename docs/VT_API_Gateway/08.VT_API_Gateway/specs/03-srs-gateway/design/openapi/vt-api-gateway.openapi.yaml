      - name: limit
        in: query
        description: 페이지 크기(커서 페이지네이션·§7.2.1)
        schema: { type: integer, default: 20, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답의 nextCursor 값을 그대로 전달·클라이언트가 직접 만들지 않음)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: 디바이스 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/clinics/{clinicId}/clients:
    parameters:
    - name: clinicId
      in: path
      required: true
      schema: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
    get:
      operationId: getAdminClinicClients
      security:
      - operatorAuth: []
      tags: [ clinics ]
      summary: 클리닉 앞단 클라이언트 SW 인벤토리 조회 — 운영자 (FR-FLEET-06) [v1.0]
      description: >-
        운영자가 해당 클리닉에서 관측된 앞단 클라이언트(CleverOne 등)의 **SW 버전·OS 인벤토리**를 조회한다(§7.8.5) — 오랜 숙원인 "각 클리닉에 깔린 SW 버전" 가시성.
        `Vatech-*` 헤더 관측이며 **식별 id 없음**이라 (product, version, os) **튜플 단위**·`lastSeen` 정체=업그레이드/제거 추정이다(대수 아님·버전 presence). product 필터·staleOnly(오래 안 보인 것)·커서 페이지네이션. EzServer 자신은 GET /v1/admin/fleet(버전·OS).
      parameters:
      - name: product
        in: query
        description: product 필터 — 정확 일치(예 CleverOne)
        schema: { type: string, example: CleverOne }
      - name: staleOnly
        in: query
        description: lastSeen 임계 초과(정체·구버전 잔존 추정)만 (boolean 토글·필터 아님)
        schema: { type: boolean, default: false, example: true }
      - name: limit
        in: query
        description: 페이지 크기(커서 페이지네이션·§7.9.1)
        schema: { type: integer, default: 50, maximum: 200, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답의 nextCursor 값을 그대로 전달·클라이언트가 직접 만들지 않음)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: 클라이언트 SW 인벤토리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientInventory'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/devices/{id}/kill:
    parameters:
    - $ref: '#/components/parameters/DeviceId'
    post:
      operationId: postAdminDevicesByIdKill
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: kill-switch(긴급·영구 정지 → revoked) (FR-FLEET-02) [v1.0]
      description: >-
        운영자가 디바이스를 **긴급·영구 정지**한다(kill-switch·FR-FLEET-02).

        1. **GW 서비스 거부**: status=**revoked** 전이 + denylist 즉시 전파(강한 일관성·§7.2.4)로 **이미 발급된 단명 토큰도 만료 전 차단**하고, 이후 토큰 발급·API 호출을 전면 거부한다.

        2. **되돌릴 수 없다(revoked=종단·복구 불가·§7.2.3)**: 다시 서비스하려면 kill 해제가 아니라 **재-enroll**(§7.2.7 — device_id 유지·새 client_id 발급·C/S 재승인)이다. **잠깐 막았다 재개할 목적이면 kill이 아니라 suspend**(PATCH /v1/admin/devices/{id} → status=suspended·복구 가능)를 쓴다.

        승인자·시각 감사(§7.9.3).
      responses:
        '200':
          description: 즉시 정지됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/audit:
    get:
      operationId: getAdminAudit
