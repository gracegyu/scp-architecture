# Vatech API Gateway - OpenAPI 3.0 (설계 초안)
#
# 작성: 초안 단계 산출물 -> baseline 시 vt-api-gateway/docs/specs/design/로 PR 이관.
# 구현 착수 후에는 NestJS code-first(@nestjs/swagger) /api-docs 산출물이 정본이 된다.
#
# 시드 출처: "VT API Gateway - API 명세·데이터 모델·주권" §1 엔드포인트.
# 범위: GW 고유 API(A — apex gw.vatech.com 호출)만 정의(§4.1.1·ADR-11, 7/2 R1).
#       프록시(B 내부·C 외부)는 target 서브도메인({target}.gw.vatech.com, Host/SNI)으로 라우팅되는 verbatim bypass이며 OpenAPI에 정의하지 않는다
#       (레지스트리 config + target OpenAPI 정본). Vatech-Target 헤더는 CleverOne→EzServer 내부 hop 키(EzServer가 서브도메인 변환). §4.1.2·§4.5.1 참조.
# 필드는 camelCase, 시간은 Unix ms(SRS §1.3). 상세 스키마는 LLD에서 확정.
# 에러 계약: 공통 Error envelope + 재사용 응답(400/401/403/404/409/429) + 프록시 GW생성 오류(502/503/504=ProxyError, §7.5.4·§7.7.4)
#   + Vatech-Error-Origin(gateway|target)·Retry-After 헤더. 인증=전 op 명시(상속 없음): deviceAuth(private_key_jwt)/operatorAuth(직원 IdP OIDC+RBAC)/webhookHmac(발신자 HMAC), 공개 ep(auth·enroll·well-known·webhooks)는 security:[]. 운영자=Entra OIDC Bearer 요청별 operatorAuth 검증(전용 verify ep 없음·7/9 R2=Entra).
#   (example·완전한 code-first 정합은 baseline 후 — Appendix B #6)
openapi: 3.0.3
info:
  title: Vatech API Gateway
  version: 0.0.0
  description: >-
    설계 초안. GW 고유 API(A — apex gw.vatech.com, §4.1.1·ADR-11)만 정의. 파일 업로드: GW는 presigned 발급 안 함 — CleverSpace(경로②)·AXS(경로③) 발급, GW 중계(§4.1.4·§7.4). 프록시(B 내부·C 외부)는 target 서브도메인({target}.gw.vatech.com, Host/SNI)으로 라우팅되는 verbatim bypass이며 본 파일에 정의하지 않는다 — CleverSpace presign=경로②(cleverspace.gw.vatech.com, CS OpenAPI 정본), AXS presign/파일=경로③(axs.gw.vatech.com, ④). Vatech-Target 헤더는 CleverOne→EzServer 내부 hop 키(EzServer가 서브도메인 변환). 라우팅 규칙은 §4.1.2·§4.5.1(7/2 R1).
servers:
- url: https://gw.vatech.com
  description: >-
    GW 고유 API(A) apex(§4.5.1). 프록시 target은 {target}.gw.vatech.com 서브도메인(레지스트리 등록·본 파일 미정의)

tags:
- name: auth
  description: 인증·토큰 (SRS §7.1)
- name: enrollment
  description: 온보딩 (SRS §7.2)
- name: devices
  description: 디바이스 레지스트리·lifecycle (SRS §7.2)
- name: clinics
  description: 클리닉 관리·리전 등록/변경 (클리닉 생성·초기 region은 enroll이 흡수 §2.3.1) (SRS §7.3)
- name: regions
  description: GW 운영 리전 카탈로그·조회 (SRS §7.3.6)
- name: webhooks
  description: 외부 이벤트 수신·분배 (SRS §7.6)
- name: compatibility
  description: API 버전 호환성 공시 (SRS §7.7)
- name: fleet
  description: 디바이스 heartbeat·상태 보고 (device→GW 능동 보고, SRS §7.8.1)
- name: admin
  description: 관리·감사 API (SRS §7.8·§7.9, ③-C Console이 호출)

# 기본 인증 = operatorAuth(운영자/Console). 디바이스 API는 op에서 deviceAuth로, 공개 ep(auth·enroll·webhook·well-known)는 security:[]로 재정의.
security:
- operatorAuth: []

paths:
  # ─────────── 범위 노트: 비-API 경로 — GW 고유 API(A)가 아니라 프록시/발급 위임이라 본 파일에 정의하지 않음 ───────────
  # --- 파일 업로드: GW 고유 API 없음 ---
  # presigned 발급 주체 = CleverSpace(경로②)·AXS(경로③). GW는 발급 요청을 target 서브도메인 proxy로 중계(bypass)만 하며 서명·세션·storage를 갖지 않는다(§4.1.4·§7.4 · ADR-03/04 철회).

  # --- 프록시(B 내부·C 외부)는 본 OpenAPI에 정의하지 않는다 (§4.1.1·§4.1.2·ADR-11, 7/2 R1) ---
  # 라우팅 = target 서브도메인({target}.gw.vatech.com, Host/SNI · 라벨=논리 ID) → 레지스트리 allowlist→host 해석. 미등록 라벨=404.
  # GW는 클라이언트가 친 target 경로를 host만 바꿔 verbatim 전달(요청/응답 body 그대로). 경로를 GW가 정의/변환하지 않음.
  #   - 경로②(B): cleverspace.gw.vatech.com — CleverSpace OpenAPI 정본
  #   - 경로③(C): axs.gw.vatech.com — AXS OpenAPI 스냅샷 + ④ Sub-SRS 정본 (OAuth2·egress allowlist는 GW 정책)
  # apex gw.vatech.com 호출만 아래 GW 고유 API(A)로 처리된다. Vatech-Target 헤더는 CleverOne→EzServer 내부 hop 키(EzServer가 서브도메인 변환).
  #
  # 프록시 에러·복원력 계약 (정본 §7.5.4·§7.7.4 — 경로가 아니라 전 프록시 공통이므로 여기 주석으로 기술):
  #   - GW→target 연결 timeout(connect/response/total_deadline, Target)=GW 책임(7/2 R4·D1~D3): GW가 target에 직접 연결하는 HTTP 클라이언트라 자기 호출 bound. total_deadline < 클라이언트 타임아웃.
  #   - 클라이언트 타임아웃 인지(D10): 프록시 호출 시 클라이언트가 선택적 요청 헤더 Vatech-Timeout-Ms(상대값 ms) 전송 가능 → GW가 내부 deadline=now+min(헤더, total_deadline)로 클램프(gRPC grpc-timeout 선례). 미전송 시 계약값(EzServer 30s, D4) 사용. 프록시는 verbatim이라 본 헤더는 target에 전달 안 함.
  #   - 재시도·서킷 브레이커=service mesh(istio) egress 담당(GW 미구현, D5~D8).
  #   - GW 정규화 오류 = ProxyError 스키마: 502 연결실패(TARGET_UNREACHABLE) / 504 timeout·deadline(TARGET_TIMEOUT, GW 자기 timeout) / 503 서킷·일시불가(TARGET_UNAVAILABLE, mesh). 헤더 Vatech-Error-Origin: gateway.
  #     재사용 응답 정의 = components/responses/{TargetUnreachable(502), TargetUnavailable(503), TargetTimeout(504)} (프록시 게이트웨이 핸들러에서 사용).
  #   - target 자체 4xx/5xx = 원 코드·body verbatim 통과(GW 미변형). 헤더 Vatech-Error-Origin: target.
  #   - GW 앱레벨: 연결 timeout + 오류 정규화 + 멱등(Idempotency-Key 존중) + 클라이언트 조기 절단 시 target 호출 취소. 네트워크 재시도·서킷은 mesh 담당.

  # ═══════════════════ DEVICE-SELF PLANE (/v1/*, deviceAuth) — EzServer(디바이스)가 자기 것만 호출. auth/token·enroll 부트스트랩만 security:[] ═══════════════════

  # --- 부트스트랩(security:[]): 토큰 발급·enroll 온보딩 (§7.1·§7.2) ---

  /v1/auth/token:
    post:
      operationId: postAuthToken
      tags: [ auth ]
      summary: 디바이스 client_credentials → JWT 발급 (FR-AUTH-01/02) [v1.0]
      description: >-
        EzServer(디바이스)가 enrollment에서 등록한 개인키로 서명한 client_assertion(private_key_jwt·§7.1.1)을 제시하면,
        GW가 등록 공개키(client_public_key)로 검증하고 claim(deviceId·region·aud·TTL) 바인딩된 단명 access token을
        발급한다. 공유 secret 없음(ADR-13)·refresh token 미발급(만료 시 개인키 재서명 재발급). 공개 엔드포인트(security:[]).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: 발급된 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/enroll/start:
    post:
      operationId: postEnrollStart
      tags: [ enrollment ]
      summary: enrollment 시작(LM 라이선스·Clinic-ID 부트스트랩) → nonce challenge (FR-ENR-01/03) [v1.0]
      description: >-
        EzServer 설치 시 부트스트랩(LM 라이선스·Clinic-ID)을 제시해 enrollment를 시작하고 GW가 nonce challenge를
        발급한다(§2.3.1). GeoDNS 최근접 리전에 도달. 디바이스 신원 형성 전이라 공개 엔드포인트(security:[])·rate-limit로 보호.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollStartRequest'
      responses:
        '200':
          description: nonce challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollChallenge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/enroll/complete:
    post:
      operationId: postEnrollComplete
      tags: [ enrollment ]
      summary: 서명+공개키 검증 → 디바이스 등록 (A안 pending·C/S 승인 / B안 유효 attestation 시 active 자동) + 클리닉·region 확립 (FR-ENR-01/04·FR-RGN-*) [v1.0]
      description: >-
        nonce 서명·공개키(clientPublicKey)를 검증하고 디바이스를 status=pending으로 등록한다.
        **enroll 요청의 Clinic-ID로 clinic을 upsert(없으면 생성)하며, region 기본값은 요청이 GeoDNS로 도달한 최근접 리전**(v1.0=서울, §2.3.1·§2.7.1) — 별도 클리닉 등록 API 불요.
        active 활성화(=인증 허용)는 C/S가 GW Console에서 승인(설치 확인 + region 확정/다른 리전 override)해야 하며,
        승인은 PATCH /v1/admin/devices/{id}(status: active) [+ region override 시 PUT /v1/admin/clinics/{clinicId}/region]로 수행된다(§2.3.1·§7.2.3·§7.2.5·§7.9.2).
        **enroll B안(7/9 R4)**: 유효 `licenseAttestation`(LMP 제3자 서명) 제시 시 GW가 **LMP JWKS**로 검증해 **status=active 자동 승인**(C/S 수동 생략); attestation 없거나 검증 실패면 위 A안(pending→C/S 승인). 두 flow 공존.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollCompleteRequest'
      responses:
        '202':
          description: >-
            등록 접수됨. client_id 발급(공개키(clientPublicKey) 바인딩). **status = pending(A안·C/S 승인 대기) 또는 active(B안·유효 attestation 자동 승인)**.
            공유 secret 없음 — 이후 private_key_jwt로 인증(§7.1.1). pending 동안 토큰 미발급
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  clientId:
                    type: string
                    description: >-
                      GW가 발급한 불투명 client id(RFC 6749 §2.2·§7.2.5, 내부 식별자 비파생·비밀 아님). 이후 토큰 요청에 사용(개인키 서명으로 인증)
                  status: { $ref: '#/components/schemas/DeviceStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- Fleet 보고·config pull (§7.8) — device→GW push(edge 폴링 불가) ---

  /v1/fleet/heartbeat:
    post:
      operationId: postFleetHeartbeat
      security:
      - deviceAuth: []
      tags: [ fleet ]
      summary: 디바이스 heartbeat 보고 (FR-FLEET-01) [v1.0]
      description: >-
        device(EzServer)가 주기적으로 호출해 생존·health를 GW에 보고한다. GW는 병원 방화벽 뒤의 edge를 능동 폴링할 수 없으므로 liveness 신호는 device→GW push가 유일하다(§7.8.1). device_id는 인증 토큰 subject에서 취득하므로 본문에 넣지 않는다. GW는 수신 시각을 `fleet_state.last_heartbeat`에 기록하고 본문의 `appVersion`을 `fleet_state.app_version`에 갱신하며, 응답으로 권장 다음 주기(nextIntervalSeconds)를 돌려준다(중앙 config §7.8.4로 조정 가능). 본문의 나머지 health 힌트(diskFree·queueDepth 등)는 관측 파이프라인(§6.3.2)로 전달하며 fleet_state에 저장하지 않는다. 온라인/오프라인은 GW가 last_heartbeat의 임계값(권장 주기의 배수) 초과 여부로 파생 판정한다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetHeartbeat'
      responses:
        '200':
          description: 수신됨(다음 heartbeat 주기 지시 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetHeartbeatAck'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/fleet/config:
    get:
      operationId: getFleetConfig
      security:
      - deviceAuth: []
      tags: [ fleet ]
      summary: device 실효 중앙 config 조회 (FR-CFG-01) — gw/1.1+ 예약 [gw/1.1+]
      description: >-
        **gw/1.1+ 예약(v1.0 미사용).** v1.0 중앙 config는 GW-내부(`gw.*`)가 실사용이고 device로의 원격 config 전달은 §7.6.6 하행 레일의 미래 활용이다(§7.8.4 v1.0 범위). device(EzServer)가 자신에게 적용될 **실효 중앙 config**를 pull한다(§7.8.4). device_id는 인증 토큰 subject에서 취득하며, device는 **자기 스코프의 실효 config만** 조회한다(타 device 노출 금지). 실효값은 키별 가장 구체 스코프 우선(device > clinic > region > global, override 병합)으로 GW가 해석한다. heartbeat 응답의 configVersion이 device의 appliedConfigVersion과 다를 때 이 API를 호출하면 된다.
      responses:
        '200':
          description: device 실효 config(+ 버전)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetConfig'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 자기 clinic·region 조회/변경 · org-binding 자가 등록 (§7.3·§2.3.1) ---

  /v1/regions:
    get:
      operationId: getRegions
      security:
      - deviceAuth: []
      tags: [ regions ]
      summary: GW 운영 리전 목록 조회 — 클라이언트 region 선택지 (§7.3.6) [v1.0 · gw/1.2 확장]
      description: EzServer Console 등이 온보딩·운영 중 region 선택을 위해 조회. v1.0=1개, gw/1.2=N개.
      responses:
        '200':
          description: 운영 리전 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/clinics/me:
    get:
      operationId: getClinicMe
      security:
      - deviceAuth: []
      tags: [ clinics ]
      summary: 내 clinic 조회 — device self(region·정보 read-back) (FR-RGN-01) [v1.0]
      description: >-
        EzServer(device)가 자기 clinic(토큰 device→clinic)의 현재 값을 읽는다 — region(자가 설정 후
        확인)·이름·국가·연락처·mappingVersion. clinicId를 path에 받지 않는다(토큰 기준 self·격리 자명). 운영자 조회는 GET
        /v1/admin/clinics/{clinicId}.
      responses:
        '200':
          description: 내 clinic 레코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: patchClinicMe
      security:
      - deviceAuth: []
      tags: [ clinics ]
      summary: 내 clinic 정보 보정 — device self(수동·enroll 스냅샷 교정·LMP 자동 sync 아님) (FR-RGN-06) [v1.0]
      description: >-
        LMP에서 clinic 정보가 바뀌면 EzServer가 자기 clinic의 표시·연락 정보(ClinicInfo)를 갱신한다(LMP=SoT·§2.3.1).
        region·clinicId 제외(region=PUT /v1/clinics/me/region). 토큰 기준 self. **clinic 정보는 enroll 시점 스냅샷이며 LMP 변경을 자동 sync하지 않는다**(7/9 R3) — 본 API는 (재)enroll 외 수동 보정용. 수집 필드셋 확정(name·countryCode·address·phone·website).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicInfo' }
      responses:
        '200': { description: 갱신됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/clinics/me/region:
    put:
      operationId: putClinicMeRegion
      security:
      - deviceAuth: []
      tags: [ clinics ]
      summary: 내 clinic 접속 리전 설정 — device self(EzServer Console) (FR-RGN-04) [v1.0 · gw/1.2 확장]
      description: >-
        EzServer Console에서 자기 clinic의 접속 GW 리전을 설정/변경(현장에선 사실상 C/S 조작). mapping_version++·전건 감사.
        v1.0: 단일 리전이라 실질 no-op. gw/1.2: 다중 리전에서 유효 — 국경 간 변경은 재동의·주권 재평가(FR-COMP-02) 가드레일
        TBD(Appendix B). 기존 PHI는 옛 리전 잔류(자동 이관 없음).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ region ]
              properties:
                region: { type: string, example: apne2 }
      responses:
        '200': { description: 변경됨(감사 동반) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/clinics/me/org-bindings:
    post:
      operationId: postClinicMeOrgBindings
      security:
      - deviceAuth: []
      tags: [ clinics ]
      summary: 내 clinic 외부 target Org-ID 자가 등록 — device self(연동 켤 때) (FR-INT-*) [v1.0]
      description: >-
        클리닉(자기)이 외부 연동(예 AXS)을 켤 때 그 target의 Org-ID를 등록 → org_mapping((target,
        Org-ID)→clinic·webhook 분배 키). Org-ID는 target 온보딩에서 발급(§2.3.4·④). **경우 A(이미 연동)=보유
        Org-ID로 즉시 등록 / 경우 B(미연동)=AXS link 프록시로 Org-ID 획득 후 등록 — 두 경우 모두 본 엔드포인트로 수렴**(GW 고유 API는
        Org-ID만 필요·case-agnostic; link는 프록시 레일). 토큰 기준 self. 운영자 교정은 POST /v1/admin/org-mappings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgBinding' }
      responses:
        '201': { description: 등록됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ═══════════════════ OPERATOR PLANE (/v1/admin/*, operatorAuth+RBAC) — Admin/C-S가 GW Console에서 호출. 전부 Entra OIDC Bearer 요청별 검증(7/9 R2=Entra·§7.1.4) ═══════════════════

  # --- 운영자 자기 정보 (로그인 후 Console UI 신원·역할 조회) ---

  /v1/admin/me:
    get:
      operationId: getAdminMe
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 현재 운영자 신원·역할·상태 조회 — Console UI 부트스트랩 (FR-AUTH-08·09) [v1.0]
      description: >-
        로그인한 운영자 자신의 신원·**GW가 부여한 실효 역할·접근 상태**를 반환한다 — Console이 메뉴·권한을 렌더하는 부트스트랩용(7/9 R2 A방안).
        **authN=Entra SSO, authz=GW DB**: `operatorAuth`(요청별 Entra JWKS 검증)로 신원(subject)만 확인하고, **역할은 GW `operator_role`(status=active)에서 조회**(토큰 claim 에코 아님·§7.1.4·§7.9.2). 첫 SSO면 GW가 operator를 **JIT 생성**한다.
        **accessState**: `active`(실효 역할 ≥1) / `no_access`(로그인은 되나 역할 0 → Console "권한 요청" 화면) / `suspended`(정지). `no_access`면 Console은 `POST /v1/admin/me/access-requests`로 역할 요청 화면을 띄운다.
      responses:
        '200':
          description: 현재 운영자 신원·역할
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorMe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 운영자 인가(RBAC) 관리 (§7.1.4·§7.9.2 · 7/9 R2 A: authN=Entra SSO · authz=GW) ---

  /v1/admin/me/access-requests:
    post:
      operationId: postAdminMeAccessRequests
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 본인 권한(역할) 요청 — 미등록/추가 권한 (FR-ADM-02) [v1.0]
      description: >-
        로그인은 됐으나 실효 역할이 없거나(no_access) 추가 역할이 필요한 운영자가 역할을 **멀티 요청**한다(§7.9.2·7/9 R2 A). 각 역할이 `operator_role` status=requested로 생성돼 **Admin 승인 큐**(GET /v1/admin/access-requests)에 오른다. Admin 알림은 Console/OOB(③-C).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestCreate' }
      responses:
        '201': { description: 요청됨(승인 대기) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/operators:
    get:
      operationId: getAdminOperators
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 운영자 목록 조회 — Admin (FR-ADM-02) [v1.0]
      description: 운영자(사내 직원) 목록·상태·실효 역할 조회(Admin 전용·§7.9.2).
      parameters:
      - name: status
        in: query
        description: 운영자 상태 필터(정확 일치)
        schema: { type: string, enum: [ active, suspended ] }
      - name: role
        in: query
        description: 역할 보유 필터(정확 일치·예 cs)
        schema: { type: string, example: cs }
      - name: limit
        in: query
        description: 페이지 크기(커서 페이지네이션)
        schema: { type: integer, default: 50, maximum: 200, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답 nextCursor 그대로)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: 운영자 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/operators/{operatorId}:
    parameters:
    - name: operatorId
      in: path
      required: true
      schema: { type: string, example: op_7f3a2b1c }
    get:
      operationId: getAdminOperatorsById
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 운영자 단건 조회(+역할·요청 이력) — Admin (FR-ADM-02) [v1.0]
      description: 단일 운영자 신원·상태·역할/요청 이력 조회(Admin·§7.9.2).
      responses:
        '200':
          description: 운영자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: patchAdminOperatorsById
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 운영자 상태 변경(정지/복구) — Admin·오프보딩 (FR-ADM-02) [v1.0]
      description: >-
        운영자 status(active↔suspended) 변경(§7.9.2). suspended=역할 무관 접근 차단(오프보딩·Entra 비활성과 병행). 감사 action=operator.status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ status ]
              properties:
                status: { type: string, enum: [ active, suspended ], example: suspended }
      responses:
        '200': { description: 변경됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/operators/{operatorId}/roles:
    parameters:
    - name: operatorId
      in: path
      required: true
      schema: { type: string, example: op_7f3a2b1c }
    post:
      operationId: postAdminOperatorRoles
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 운영자 역할 직접 부여 — Admin (FR-ADM-02) [v1.0]
      description: >-
        Admin이 운영자에게 역할을 직접 부여한다(요청 없이 즉시 active·§7.9.2). CS=global(전 클리닉). 감사 action=operator.role.grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleGrantCreate' }
      responses:
        '201': { description: 부여됨(active) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/operators/{operatorId}/roles/{grantId}:
    parameters:
    - name: operatorId
      in: path
      required: true
      schema: { type: string, example: op_7f3a2b1c }
    - name: grantId
      in: path
      required: true
      schema: { type: string, example: grt_7f3a2b1c }
    patch:
      operationId: patchAdminOperatorRole
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 역할 부여 결정(승인/거부/회수) — Admin (FR-ADM-02) [v1.0]
      description: >-
        요청(requested)을 **승인(active)/거부(rejected)** 하거나 부여된(active) 역할을 **회수(revoked)** 한다(§7.9.2). 거부·회수는 행을 보존(감사). 감사 action=operator.role.decide.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleGrantDecision' }
      responses:
        '200': { description: 반영됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/access-requests:
    get:
      operationId: getAdminAccessRequests
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 권한 요청 승인 큐 — Admin (FR-ADM-02) [v1.0]
      description: >-
        승인 대기(requested) 역할 요청을 운영자 횡단으로 조회한다(Admin 승인 큐·§7.9.2) — 각 항목은 operator + requested 역할. 승인/거부는 PATCH /v1/admin/operators/{operatorId}/roles/{grantId}.
      parameters:
      - name: limit
        in: query
        description: 페이지 크기
        schema: { type: integer, default: 50, maximum: 200, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답 nextCursor 그대로)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: 승인 대기 요청 목록(operator + requested 역할)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 디바이스 관리·enroll 승인 (§7.2·§7.8) ---

  /v1/admin/devices:
    get:
      operationId: getAdminDevices
      parameters:
      - name: status
        in: query
        description: 상태 필터(정확 일치)
        schema: { $ref: '#/components/schemas/DeviceStatus' }
      - name: clinicId
        in: query
        description: 클리닉 필터 — clinic_id 정확 일치(exact)
        schema: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
      - name: limit
        in: query
        description: 페이지 크기(커서 페이지네이션·§7.2.1)
        schema: { type: integer, default: 20, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답의 nextCursor 값을 그대로 전달·클라이언트가 직접 만들지 않음)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      security:
      - operatorAuth: []
      tags: [ devices ]
      summary: 디바이스 목록 조회 (FR-DEV-01) [v1.0]
      description: >-
        운영자(Console)가 디바이스 목록을 조회한다(상태·클리닉 필터·커서 페이지네이션·§7.2.1). 디바이스 레지스트리·lifecycle 운영·감사용.
      responses:
        '200':
          description: 디바이스 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: postAdminDevices
      security:
      - operatorAuth: []
      tags: [ devices ]
      summary: 디바이스 등록 (FR-DEV-01) [v1.0]
      description: >-
        운영자가 디바이스를 수동 등록한다 — **예외 경로**이며 주 생성은 EzServer enroll이 흡수한다(§2.3.1·일상 경로 아님). body는
        Device 스키마지만 **deviceId·clientId·status·createdAt/updatedAt은 GW가 생성/기본값**(운영자 미지정) — 운영자는
        clinicId(+선택 clientPublicKey)만 의미. 인증 자격 없는 device는 이후 자격 발급 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      responses:
        '201':
          description: 등록됨
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/devices/{id}:
    parameters:
    - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: getAdminDevicesById
      security:
      - operatorAuth: []
      tags: [ devices ]
      summary: 디바이스 조회 (FR-DEV-01) [v1.0]
      description: '운영자가 단일 디바이스의 상세(상태·clinic·client_id·시각)를 조회한다.'
      responses:
        '200':
          description: 디바이스
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      operationId: patchAdminDevicesById
      security:
      - operatorAuth: []
      tags: [ devices ]
      summary: lifecycle 상태 전이 (FR-DEV-03, pending→active→suspended→revoked) [v1.0]
      description: >-
        디바이스 lifecycle 전이. **pending→active는 C/S enrollment 승인 게이트**
        (현장 설치 담당 C/S만 승인 = 부트스트랩 신뢰 앵커, §2.3.1·§7.2.5·§7.9.2).
        모든 전이는 승인자·시각 감사(§7.9.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          description: 갱신됨
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 클리닉 관리 (§7.3 · list/read/create/update·region) ---

  /v1/admin/clinics:
    get:
      operationId: getAdminClinics
      security:
      - operatorAuth: []
      tags: [ clinics ]
      summary: 클리닉 목록 조회 — 운영자(커서 페이지네이션) (FR-RGN-06) [v1.0]
      description: '운영자(Console)가 클리닉 목록을 조회한다(region 필터·커서 페이지네이션·§7.2.1). fleet 클리닉 관리·검색용. clinic은 lifecycle status가 없다(device와 달리 상태 필터 없음).'
      parameters:
      - name: region
        in: query
        description: 리전 필터 — region_catalog.regionId 정확 일치(exact)
        schema: { type: string, example: apne2 }
      - name: limit
        in: query
        description: 페이지 크기(커서 페이지네이션·§7.2.1)
        schema: { type: integer, default: 20, example: 20 }
      - name: cursor
        in: query
        description: 다음 페이지 커서 — 불투명 토큰(직전 응답의 nextCursor 값을 그대로 전달·클라이언트가 직접 만들지 않음)
        schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: 클리닉 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Clinic' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: postAdminClinics
      security:
      - operatorAuth: []
      tags: [ clinics ]
      summary: 클리닉 수동 등록·교정 — 운영자(예외 경로·주=enroll) (FR-RGN-06) [v1.0]
      description: >-
        클리닉 존재·초기 region은 EzServer enroll이 자동 확립(§2.3.1). 본 엔드포인트는 운영자의 예외적 수동 등록·교정용(일상 경로 아님).
        region 변경은 PUT /v1/admin/clinics/{clinicId}/region.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicRegistration' }
