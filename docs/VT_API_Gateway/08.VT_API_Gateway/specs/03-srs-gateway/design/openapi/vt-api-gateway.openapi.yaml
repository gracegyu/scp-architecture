  # --- 디바이스 긴급 정지(kill)·감사 로그 조회 (§7.8.2·§7.9) ---

  /v1/admin/clinics/{clinicId}/devices:
    parameters:
    - name: clinicId
      in: path
      required: true
      schema:
        type: string
        example: d3f1a9c07b6e4258af31c9d2e0b4a687
    get:
      operationId: getAdminClinicDevices
      security:
      - operatorAuth: []
      tags: [ devices ]
      summary: 클리닉 소속 디바이스 목록 — 운영자 (FR-DEV-01) [v1.0]
      description: >-
        운영자(Console)가 특정 클리닉에 소속된 디바이스 목록을 조회한다 — clinic↔device **1:N 관계의 자연 표현**
        (clinic 상세 화면의 하위목록용·③-C·Appendix B #47). 결과는 GET /v1/admin/devices?clinicId= 와 동일하나
        경로로 소속 관계를 일급화. 상태 필터·커서 페이지네이션(§7.2.1).
      parameters:
      - name: status
        in: query
