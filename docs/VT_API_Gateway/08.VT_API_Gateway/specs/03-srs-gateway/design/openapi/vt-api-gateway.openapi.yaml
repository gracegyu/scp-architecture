        운영자가 클리닉 표시·연락 정보(ClinicInfo)를 교정한다. region 변경은 PUT /v1/admin/clinics/{clinicId}/region.
        device 자가 보정은 PATCH /v1/clinics/me. **clinic 정보는 enroll 스냅샷·LMP 자동 sync 아님(7/9 R3)** — 본 교정은 Console 표시 정확성용 수동 조작.
