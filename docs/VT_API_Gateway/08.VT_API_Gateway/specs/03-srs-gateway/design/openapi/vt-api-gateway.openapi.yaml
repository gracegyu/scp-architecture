      description: 이벤트 식별자(멱등 키·dedup)
      schema: { type: string, example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545 }
    get:
      operationId: getAdminWebhookEventById
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: webhook 이벤트 단건(메타) 조회 — DLQ·장애 triage (PHI-free·payload 미제공·FR-WH-*) [v1.0]
      description: >-
        운영자가 eventId로 단일 webhook 이벤트의 **메타**(state·attempts·lastError·dispatchTarget·시각 등)를 조회한다 — DLQ/장애 triage용.
        **payload 본문은 제공하지 않는다**(opaque·환자 PHI 포함 가능·§6.4·§7.6.3): 본문은 리전 로컬 S3(claim-check·짧은 TTL)에만 있고 소비자=클리닉 EzServer(MQTT 하행·§7.6.6)뿐이다. 본문 열람이 필요하면 별도 break-glass·redact·감사 경로(§7.6.3·Appendix B #36)로 다루며 본 API 범위 아님.
      responses:
        '200':
          description: webhook 이벤트 메타
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/webhook-events/{eventId}/payload:
    parameters:
    - name: eventId
      in: path
      required: true
      description: 이벤트 식별자(멱등 키·dedup)
      schema: { type: string, example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545 }
    get:
      operationId: getAdminWebhookEventPayload
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: webhook payload 원문 열람(redact) — break-glass·감사 (FR-WH-*) [v1.0]
      description: >-
        운영자가 특정 이벤트의 **본문(payload)** 을 열람한다 — 디버깅/재생 목적의 **break-glass** 경로.
        **GW가 중개**한다: 리전 로컬 GW가 자기 리전 S3(claim-check `payload_ref`)에서 읽어 **PHI 필드를 redact(마스킹)** 한 뒤 반환하며(§7.6.3·§6.4),
        **Console은 S3에 직접 접근하지 않는다**(브라우저 IAM 불가·RBAC/감사/주권/redact 우회 방지).
        **상위 RBAC(break-glass 역할) 필요**(§7.9.2·일반 operator는 403)·**전량 감사**(action=`webhook.payload.view`·§7.9.3).
        payload는 짧은 TTL이라 이벤트 없음 또는 만료 시 404. redact 필드·TTL 값은 Appendix B #36.
      responses:
        '200':
          description: redact 적용된 payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookPayloadView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- fleet 상태 조회 (§7.8, 대시보드) — device push heartbeat로 갱신, 조회 전용 ---

  /v1/admin/fleet:
    get:
      operationId: getAdminFleet
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: fleet liveness/rollout 상태(heartbeat·버전·online) 조회 — 운영 대시보드 (fleet_state·FR-FLEET-01) [v1.0]
      description: >-
        운영자가 fleet liveness/rollout 상태(마지막 heartbeat·보고 SW 버전·파생 online)를 조회한다(운영 대시보드·fleet_state·FR-FLEET-01). clinicId(device 조인)·staleOnly(online=false)로 필터. **성공률·오류 분포(FR-FLEET-03·P2)는 관측 metric(§7.8.3·§6.3.2·Grafana) 소관이며 본 API가 반환하지 않는다**(rate는 counter를 백엔드가 시간창·다중인스턴스 집계).
      parameters:
        - name: clinicId
          in: query
          schema: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
          description: clinic 필터(정확 일치)
        - name: staleOnly
          in: query
          schema: { type: boolean, default: false, example: true }
          description: last_heartbeat 임계 초과(정체) 디바이스만 (boolean 토글·필터 아님)
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200, example: 20 }
        - name: cursor
          in: query
          schema: { type: string, example: eyJkIjoiMDE5MjBhN2IifQ }
      responses:
        '200':
          description: fleet 상태 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FleetState'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 연동 대상(target) 통합 관리 (§7.5·§7.6·§7.1.3, Console ③-C) — 라우팅+자격+webhook 수신 한 레코드 ---

  /v1/admin/targets:
    get:
      operationId: getAdminTargets
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 연동 대상(target) 목록 조회 (라우팅·자격·webhook 수신 통합) (FR-INT-01/02·FR-WH-01/02) [v1.0]
      description: >-
        운영자가 등록된 연동 대상(target) **전체 목록**을 조회한다. **소규모 카탈로그**(v1.0=1개 `axs`·향후 소수 `cleverspace` 등)라 페이지네이션·필터 없음(region 카탈로그와 동일 패턴). credential_ref·secret_ref는 **KMS 참조만** 반환(시크릿 원문 미노출·§6.2).
      responses:
        '200':
          description: target 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: postAdminTargets
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: target 등록/갱신(upsert) — **연동 하나=1 레코드**(라우팅+자격+webhook 수신)·감사 action=target.upsert (FR-INT-01/02·FR-WH-01/02) [v1.0]
      description: >-
        운영자가 연동 대상(target)을 **upsert**한다 — 라우팅+아웃바운드 자격+인바운드 webhook 수신을 한 레코드로(구 3표
        병합·§7.5·§7.6). **PK `targetId`가 있으면 갱신(200)·없으면 생성(201)**. credential·secret은 KMS 저장(원문 미노출·§6.2). 감사 action=target.upsert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Target'
      responses:
        '200': { description: '갱신됨(기존 target override)' }
        '201': { description: 신규 등록됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/targets/{targetId}:
    parameters:
    - name: targetId
      in: path
      required: true
      schema: { type: string, example: axs }
    get:
      operationId: getAdminTargetsByTargetId
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: target 단건 조회 — Console 편집 폼 프리필 (FR-INT-01/02·FR-WH-01/02) [v1.0]
      description: '단일 연동 대상(target)의 전체 설정을 조회한다(편집 폼 프리필·목록과 일관). credential_ref·secret_ref는 KMS 참조만(원문 미노출·§6.2).'
      responses:
        '200':
          description: target 레코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteAdminTargetsByTargetId
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: target 삭제 — 해당 연동 전체(라우팅·자격·webhook 수신) 제거·감사 action=target.delete (FR-INT-01/02·FR-WH-01/02) [v1.0]
      description: >-
        운영자가 target을 삭제한다 — 해당 연동 전체(라우팅·자격·webhook 수신) 제거. 감사 action=target.delete.
        **종속 참조가 있으면 409**(`org_mapping`·`policy`·`webhook_event`가 targetId를 FK 참조·§6.4.1) — 먼저 매핑/정책을 정리해야 삭제 가능(연동 사용 중 오삭제·orphan 방지).
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

