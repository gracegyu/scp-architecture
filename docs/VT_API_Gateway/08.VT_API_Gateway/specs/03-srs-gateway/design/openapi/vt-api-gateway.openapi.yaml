        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteAdminRegionsByRegionId
      security:
      - operatorAuth: []
      tags: [ admin ]
      summary: 리전 회수(드묾 — draining 후) (FR-RGN-06) [gw/1.2]
      description: '운영자가 리전을 회수한다(드묾·draining 후). **다중 리전(gw/1.2)** 운영 맥락 — v1.0 단일 리전에선 사실상 미사용.'
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ═══════════════════ PUBLIC PLANE — 외부 발신자(webhookHmac)·공개 well-known · security:[] ═══════════════════

  # --- Webhook 수신 (§7.6·§4.1.3) — {target}.webhook.gw.vatech.com Host/SNI로 식별. 경로/스키마는 target 규약 수용·유연(아래 예시). GW는 발신자 HMAC 검증·라우팅만, payload 비해석 ---

  /v1/webhooks/{target}:
    post:
      operationId: postWebhooksByTarget
      tags: [ webhooks ]
      security:
      - webhookHmac: []
      summary: 외부 이벤트 Webhook 수신 (FR-WH-01~05) — target별 전용 호스트로 식별, 경로/형식 유연(예시) [v1.0]
      description: >-
        **발신자 식별 = target별 전용 호스트**(`{target}.webhook.gw.vatech.com`, Host/SNI → 레지스트리 inbound_host, §7.6.2) — source IP 비의존. 아래 경로 `/v1/webhooks/{target}`와 스키마는 **예시**이며 확정 계약이 아니다(target 규약 수용·유연, §4.1.3). **신뢰(인증) = HMAC + timestamp**(호스트명은 식별이지 인증 아님); source IP allowlist는 옵션. GW는 멱등(eventId)·라우팅만 하며 payload는 소비자가 해석한다(opaque, ④/AXS 스냅샷 참조).
      parameters:
      - name: target
        in: path
        required: true
        description: >-
          target 라벨(=Vatech-Target·서브도메인). **레지스트리(`target.inbound_host`) 기반 검증 — enum/하드코딩
          금지·런타임 등록**(§7.6.1). 미등록 라벨=404. axs는 예시일 뿐 고정 목록 아님(cleverspace 등 확장)
        schema:
          type: string
          pattern: '^[a-z0-9_]+$'
          example: axs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEnvelope'
      responses:
        '202':
          description: >-
            수신 ACK(Accepted) — 검증 직후 즉시 응답하고 처리는 내부 비동기 큐로 위임(FR-WH-04·§7.6.3). 중복 eventId도 2xx(멱등·재처리 안 함·FR-WH-03).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --- 호환성 공시 (§7.7) ---

  /.well-known/{env}/server-configuration.json:
    parameters:
    - name: env
      in: path
      required: true
      description: 환경 식별자
      schema:
        type: string
        example: production
    get:
      operationId: getWellKnownByEnvServerConfiguration
      tags: [ compatibility ]
      summary: 런타임 버전·호환성 공시 (FR-COMPAT-02) [v1.0]
      description: 스키마·샘플은 design/well-known/ 참조. 버전 프리픽스 없이 표준 관례로 노출(§4.1.2-5)
      security: []
      responses:
        '200':
          description: 서버 구성(호환성 매트릭스 공시)
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        **디바이스 인증(데이터 플레인)** — EzServer가 private_key_jwt로 `/v1/auth/token`에서 발급받은 단명 access
        token(§7.1.1·ADR-13). 디바이스가 호출하는 API에 사용. 프록시 호출은 target 서브도메인 라우팅(§4.1.2).
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        **운영자(Console) 인증(컨트롤 플레인)** — 직원 IdP(MS365/Entra) OIDC 토큰(§7.1.4). Admin/C-S가 호출하는 관리·콘솔
        API에 사용. 역할(Admin/C-S)=IdP claim→RBAC(§7.9.2).
    webhookHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: >-
        **Webhook HMAC 서명 검증(발신자 인증)** — 외부 발신자(v1.0=AXS)가 payload를 target별 시크릿으로 HMAC
        서명(§7.6.2). GW가 `target.secret_ref`(KMS)로 검증 + timestamp replay 방지. **실제 서명 헤더명·알고리즘은
        target 규약(`sig_scheme`)** 이라 발신자별로 다름(여기 `X-Signature`는 예시). source IP allowlist는 옵션.
        bearer 토큰 아님.

  headers:
    VatechErrorOrigin:
      description: 오류 책임 주체 — gateway(GW 생성) | target(대상 서버 자체 오류, verbatim 통과). §7.7.4
      schema: { type: string, enum: [ gateway, target ] }
    RetryAfter:
      description: 재시도 권고(초). 429·503에서 부여
      schema: { type: integer }
    VatechTargetLatencyMs:
      description: 프록시 시 target 응답 지연(관측, §7.5.4)
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 요청 형식·검증 오류 (400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 실패 — 토큰·서명·자격·timestamp (401)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 부족 — scope·RBAC·정책 거부 (403)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음 / 미등록 (404)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 멱등 충돌 / 중복 등록 / 상태 전이 위반 (409)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: rate limit 초과 (429)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    # --- 프록시(B/C) 전용 — GW 생성 오류. 특정 경로가 아니라 target 서브도메인 proxy 공통(§7.5.4·§7.7.4). ---
    # --- target 자체 4xx/5xx는 본 응답을 쓰지 않고 원응답을 verbatim 통과(Vatech-Error-Origin: target). ---
    # --- ※ 아래 Target* 응답·ProxyError 스키마·Vatech* 헤더는 프록시 경로가 OpenAPI에 정의되지 않아(bypass, §4.1.1) '정의만·미참조'다 → redocly `no-unused-components` 경고는 **의도된 것**(프록시 핸들러 구현 계약 참조용). ---
    TargetUnreachable:
      description: target 연결 실패(거부·DNS·TLS) — GW 연결 timeout·GW 정규화 (502)
      headers:
        Vatech-Error-Origin: { $ref: '#/components/headers/VatechErrorOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
    TargetUnavailable:
      description: 서킷 개방(mesh/istio) / target 일시 불가 — GW 정규화 (503)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Vatech-Error-Origin: { $ref: '#/components/headers/VatechErrorOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
    TargetTimeout:
      description: target 응답 지연 — GW 연결 timeout(response/total_deadline, D2/D3) 초과·GW 정규화 (504)
      headers:
        Vatech-Error-Origin: { $ref: '#/components/headers/VatechErrorOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: device_id (UUIDv7·§7.2.1)
      schema:
        type: string
        format: uuid
        example: 01920a7b-3c4d-7e5f-8a90-1b2c3d4e5f60

  schemas:
    # 공통 오류 envelope (GW 생성 — §7.7.4). 프록시 target 자체 오류는 verbatim이라 미적용.
    Error:
      type: object
      required: [ errorCode ]
      properties:
        errorCode: { type: string, description: '표준 오류코드(§7.7.4)', example: COMPAT_CLIENT_TOO_OLD }
        message: { type: string, example: '클라이언트 업데이트가 필요합니다.' }
        requestId: { type: string, description: '상관 추적용 ID(§6.3.2)', example: req_9f2a7c1b3d }
        details: { type: object, description: '필드 검증 오류 등 부가 정보', example: { field: clientId, reason: required } }
      description: 'GW 표준 오류 응답 본문(§7.7.4)'
    # 인증
    TokenRequest:
      type: object
      required: [ clientId, clientAssertion ]
      description: >-
        디바이스 머신 인증 = OAuth2 client_credentials + private_key_jwt(비대칭, ADR-13·§7.1.1).
        공유 client_secret 미사용 — 디바이스 개인키로 서명한 JWT assertion을 GW가 등록된 공개키(clientPublicKey)로 검증.
      properties:
        clientId:
          type: string
          example: gwc_Qk9y3Zx1aB2cD3eF4gH5iJ
        clientAssertionType:
          type: string
          description: RFC 7523 고정값
          default: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
          example: 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
        clientAssertion:
          type: string
          description: 디바이스 개인키로 서명한 JWT assertion(소지 증명). GW가 등록된 공개키(clientPublicKey)로 검증(§7.1.1)
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImV6LThmM2EyYiJ9.eyJpc3MiOiJnd2Nf...
        scope:
          type: string
          description: >-
            요청 권한 scope(공백 구분·형식 `{target}:{resource}.{action}`). **v1.0 미사용·예약(gw/1.1+ 세분화용)** — v1.0은 AXS + Org-ID가 데이터·작업 격리를 하므로 GW는 target 단위로만 굵게 인가하고 scope 세분화는 하지 않는다(§7.5.3). EzServer는 v1.0에 보내지 않아도 된다. 미래 활성화 시 정책/OPA가 검증(초과 403). axs는 예시일 뿐 엔드포인트가 AXS 전용이란 뜻 아님.
          example: axs:patient.read axs:study.write
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIwMTkyMGE3Yi...
        expiresAt:
          type: integer
          format: int64
          description: Unix ms
          example: 1720224000000
        claims:
          type: object
          description: device_id·region·aud·TTL 강제 바인딩(§7.1.1)
          example: { deviceId: 01920a7b-3c4d-7e5f-8a90-1b2c3d4e5f60, region: apne2, aud: axs.gw.vatech.com }
    OperatorMe:
      type: object
      required: [ subject, accessState, roles ]
      description: >-
        현재 운영자 신원·**GW 부여 실효 역할·접근 상태** — GET /v1/admin/me. authN=Entra SSO(subject), authz=GW `operator_role`(status=active)에서 조회(§7.1.4·§7.9.2·7/9 R2 A).
      properties:
        subject: { type: string, description: 'Entra oid/sub(SSO 신원)', example: entra-8f3a2b1c }
        displayName: { type: string, nullable: true, description: 표시명(Entra claim), example: 홍길동 }
        email: { type: string, nullable: true, example: gd.hong@vatech.com }
        accessState:
          type: string
          enum: [ active, no_access, suspended ]
          description: 'active=실효 역할≥1 / no_access=로그인OK·역할0(권한 요청 화면) / suspended=정지'
          example: active
        roles:
          type: array
          description: 'GW 부여 실효 역할(operator_role status=active). 빈 배열=no_access'
          items: { $ref: '#/components/schemas/RoleGrant' }
          example: [ { role: cs, scopeType: global, status: active } ]

    RoleGrant:
      type: object
      required: [ role, status ]
      description: '운영자 역할 부여 1건(operator_role). RBAC 역할 + 데이터 스코프 + lifecycle.'
      properties:
        id: { type: string, description: 'grant id(승인/거부/회수 대상)', example: grt_7f3a2b1c }
        role: { type: string, enum: [ admin, developer, cs, operator ], description: '역할(소스코드 enum·operator_role_type·§7.9.2). 추가 시 DB enum+GW+Console 소스 동시 수정', example: cs }
        scopeType:
          type: string
          nullable: true
          enum: [ global, region, clinic ]
          description: '데이터 스코프(config/policy와 동일 다형). CS=global(전 클리닉). null→global'
          example: global
        scopeId: { type: string, nullable: true, description: 'global=null / region=regionId / clinic=clinicId', example: null }
        status:
          type: string
          enum: [ requested, active, rejected, revoked ]
          description: 'requested(승인 대기)·active(실효)·rejected(거부·보존)·revoked(회수)'
          example: active
        note: { type: string, nullable: true, description: '요청/결정 사유', example: 설치 지원 담당 }
        requestedAt: { type: integer, format: int64, nullable: true, example: 1720137600000 }
        decidedBy: { type: string, nullable: true, description: '승인/거부한 Admin(subject)', example: entra-admin-1 }
        decidedAt: { type: integer, format: int64, nullable: true, example: 1720138000000 }

    Operator:
      type: object
      required: [ id, subject, status ]
      description: '운영자(사내 직원) 신원 — Admin 관리 뷰(operator 테이블). authN=Entra SSO·authz=GW.'
      properties:
        id: { type: string, example: op_7f3a2b1c }
        subject: { type: string, description: 'Entra oid/sub', example: entra-8f3a2b1c }
        email: { type: string, nullable: true, example: gd.hong@vatech.com }
        displayName: { type: string, nullable: true, example: 홍길동 }
        status:
          type: string
          enum: [ active, suspended ]
          description: 'active(정상)/suspended(정지·오프보딩). 실효 역할 0이면 active여도 접근 no_access'
          example: active
        roles:
          type: array
          description: '부여/요청 역할 목록(active·requested·rejected·revoked)'
          items: { $ref: '#/components/schemas/RoleGrant' }
        createdAt: { type: integer, format: int64, description: '최초 로그인(JIT) 시각(Unix ms)', example: 1720137600000 }
        updatedAt: { type: integer, format: int64, example: 1720224000000 }

    AccessRequestCreate:
      type: object
      required: [ roles ]
      description: '본인 권한(역할) 요청 — POST /v1/admin/me/access-requests. 멀티 역할 요청 → 각 requested 생성 → Admin 승인 큐.'
      properties:
        roles:
          type: array
          minItems: 1
          description: '요청 역할 목록(멀티). 스코프 생략 시 global'
          items:
            type: object
            required: [ role ]
            properties:
              role: { type: string, enum: [ admin, developer, cs, operator ], example: cs }
              scopeType: { type: string, nullable: true, enum: [ global, region, clinic ], example: global }
              scopeId: { type: string, nullable: true, example: null }
          example: [ { role: cs }, { role: operator, scopeType: region, scopeId: apne2 } ]
        note: { type: string, nullable: true, description: '요청 사유(Admin 참고)', example: 호주 클리닉 설치 지원 }

    RoleGrantCreate:
      type: object
      required: [ role ]
      description: 'Admin 직접 역할 부여 — POST /v1/admin/operators/{operatorId}/roles(즉시 active).'
      properties:
        role: { type: string, enum: [ admin, developer, cs, operator ], example: cs }
        scopeType: { type: string, nullable: true, enum: [ global, region, clinic ], example: global }
        scopeId: { type: string, nullable: true, example: null }
        note: { type: string, nullable: true, example: CS 전 클리닉 관리 }

    RoleGrantDecision:
      type: object
      required: [ status ]
      description: 'Admin 결정 — PATCH …/roles/{grantId}. requested→active(승인)/rejected(거부), active→revoked(회수).'
      properties:
        status: { type: string, enum: [ active, rejected, revoked ], example: active }
        note: { type: string, nullable: true, example: 승인 }

    # 온보딩
    EnrollStartRequest:
      type: object
      required: [ bootstrap ]
      properties:
        bootstrap:
          type: string
          description: >-
            부트스트랩 신뢰 = LM 라이선스·Clinic-ID(EzServer가 설치 시 LMP에서 수신).
            공장 토큰/OOB 코드는 미도입(GW 사전 발급 토큰 없음). 최종 활성화는 C/S Console 승인(§2.3.1·§7.2.5).
            example의 LM-LIC 형식은 illustrative — LMP 라이선스 id 실제 형식 미확정(#43·LMP 실데이터 확인 대상)
          example: 'LM-LIC-8f3a2b1c:d3f1a9c07b6e4258af31c9d2e0b4a687'
        serial:
          type: string
          description: '대상 디바이스 시리얼(부트스트랩 식별). example는 illustrative — EzServer 시리얼 실제 형식 미확정(#46)'
          example: EZ-SN-2024-012345
    EnrollChallenge:
      type: object
      properties:
        nonce:
          type: string
          example: n_7f3a2b1c9d8e4f5a
        expiresAt:
          type: integer
          format: int64
          example: 1720137900000
    EnrollCompleteRequest:
      type: object
      required: [ nonceSignature, clientPublicKey ]
      properties:
        nonceSignature:
          type: string
          description: EzServer 개인키로 nonce 서명(소지 증명, §7.2.6)
          example: MEUCIQDf3a...base64sig...cQ==
        clientPublicKey:
          type: string
          description: >-
            EzServer 생성 키페어의 공개키(또는 key-id) = 디바이스 공개키(clientPublicKey). 물리 머신 지문 아님. 재설치 시 새
            키→재-enroll로 회전(§7.2.6·7.2.7)
          example: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
            -----END PUBLIC KEY-----
        clinic:
          $ref: '#/components/schemas/ClinicInfo'
        licenseAttestation:
          type: string
          nullable: true
          description: >-
            **(예약 · v1.0 미사용 · enroll B안)** LMP가 라이선스 검증 후 발급한 **제3자 서명 attestation(JWT)**. 제시 시 GW가 **LMP JWKS**(런타임 fetch+캐시)로 검증 성공하면 C/S 수동 승인 없이 **status=active 자동 승인**(§2.3.1 B). 없으면 A안(pending→C/S 승인). **Agenda R9·Appendix B #42 확정 시 활성**·v1.0 미전송. 상세=③-P-LMP OnePager.
          example: null

    # 디바이스
    DeviceStatus:
      type: string
      enum: [ pending, active, suspended, revoked ]
      description: >-
        디바이스 lifecycle 상태(§7.2.3 상태기계).
        **pending**=enroll 완료·C/S 승인 대기(인증 불가) /
        **active**=정상 운영(C/S 승인 후·인증·호출 허용) /
        **suspended**=일시 정지(운영자/정책·**복구 가능**) /
        **revoked**=폐기·자격 무효(**종단·복구 불가**·kill-switch 결과).
        허용 전이: pending→active(C/S 승인) · active↔suspended(정지·재개) · active|suspended→revoked(폐기).
        revoked에서 재서비스는 되돌리기가 아니라 재-enroll(§7.2.7).
      example: active
    Device:
      type: object
      description: >-
        디바이스 = GW 호출 주체(머신 클라이언트, §1.2·§1.4) — v1.0 유일 종류=EzServer(clinic-bound); 미래 비-EzServer/clinic-less 가능(§1.2 Will Not Do). clinicId nullable.
        인증 자격도 여기에 통합 — 별도 Credential 스키마 없음(2026-07-01). 인증=private_key_jwt(비대칭, ADR-13): clientId + clientPublicKey(공개키)로 검증, 공유 secret 없음.
      properties:
        deviceId:
          type: string
          format: uuid
          description: 'GW 발급 UUIDv7(RFC 9562·불투명·시간정렬, §7.2.1). 재설치·키 회전에도 유지'
          example: 01920a7b-3c4d-7e5f-8a90-1b2c3d4e5f60
        clinicId:
          type: string
          nullable: true
          description: >-
            소속 클리닉(등록 시 포함). nullable — 미래 클리닉 비소속(비-EzServer) 디바이스. region은 clinic에서 파생(§6.4.1 A안,
            region 컬럼 없음)
          example: d3f1a9c07b6e4258af31c9d2e0b4a687
        clinic:
          type: object
          nullable: true
          readOnly: true
          description: >-
            소속 클리닉 **요약 임베드**(읽기 전용·조회 편의 — 화면이 clinic을 2차 조회 안 하도록). clinicId가 null이면(clinic-less) 이 값도 null.
            정본=Clinic 스키마·GET /v1/admin/clinics/{clinicId}. 쓰기 시 무시(clinicId만 사용).
          properties:
            clinicId: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
            name: { type: string, nullable: true, example: ES Clinic }
            region: { type: string, description: '파생 리전(clinic.region·§6.4.1)', example: apne2 }
        clientId:
          type: string
          nullable: true
          description: >-
            OAuth2 client id — GW가 enroll 시 발급한 불투명 식별자(RFC 6749 §2.2·§7.2.5, 내부 식별자 비파생·비밀 아님).
            nullable — client 자격 미발급 device(enroll 전·미래 비인증). 토큰 요청 시 이 값 + 개인키 서명(private_key_jwt)으로
            인증(§7.1.1)
          example: gwc_Qk9y3Zx1aB2cD3eF4gH5iJ
        clientPublicKey:
          type: string
          nullable: true
          description: >-
            enrollment 키페어의 공개키(또는 key-id) = 디바이스 공개키(clientPublicKey). 인증 assertion 서명 검증에
            사용(§7.1.1). 물리 머신 지문 아님
          example: ez-8f3a2b
        status:
          $ref: '#/components/schemas/DeviceStatus'
        createdAt:
          type: integer
          format: int64
          description: >-
            등록 시각(Unix ms, §1.3·DBML device.created_at)
          example: 1720137600000
        updatedAt:
          type: integer
          format: int64
          description: >-
            수정 시각(Unix ms·DBML device.updated_at)
          example: 1720224000000

    # 리전
    # Fleet heartbeat (§7.8.1)
    FleetHeartbeat:
      type: object
      description: >-
        device가 GW로 보고하는 heartbeat 본문. 모든 필드 선택 — 본문이 비어도 수신 시각만으로 liveness가 성립한다. device_id는 인증 토큰 subject에서 취득(본문 불요).
      properties:
        appVersion:
          type: string
          description: 'device(EzServer) 소프트웨어 버전 — 호환성·롤아웃 가시성(§7.7·§7.8.4)'
          example: 6.3.1.3
        os:
          type: string
          description: 'device(EzServer) OS(verbatim·미파싱). fleet_state.os에 기록(§7.8.5)'
          example: Windows/11
        metrics:
          type: object
          description: >-
            device-local health 힌트(선택). GW가 **관측 파이프라인(OTel→Alloy·§6.3.2)로 전달**하는 입력이며 **fleet_state에 저장하지 않는다**. 성공률·오류 분포는 metric counter로 백엔드가 집계(§7.8.3)하지 여기 스칼라로 넣지 않는다.
          properties:
            diskFreeBytes: { type: integer, format: int64, description: '가용 디스크(바이트)', example: 214748364800 }
            queueDepth: { type: integer, description: '미전송 큐 적체(업로드·이벤트)', example: 3 }
        appliedConfigVersion:
          type: string
          description: >-
            (gw/1.1+ 예약·v1.0 미사용) device가 현재 적용 중인 중앙 config 실효 버전 = 콘텐츠 해시(§7.8.4). GW가 실효 버전과 동등성
            비교해 drift(미반영) 판정
          example: sha256:9f2a7c1b3d8e...
    FleetHeartbeatAck:
      type: object
      required: [ receivedAt, nextIntervalSeconds ]
      properties:
        receivedAt:
          type: integer
          format: int64
          description: 'GW 수신 시각(Unix ms) — fleet_state.last_heartbeat에 기록됨'
          example: 1720224000123
        nextIntervalSeconds:
          type: integer
          description: >-
            다음 heartbeat까지 권장 간격(초). 정본=중앙 config(§7.8.4 gw.heartbeat.interval_seconds)에서 device 스코프
            resolve, 없으면 .env 기본값(§7.8.1). device는 이 값에 맞춰 다음 호출 주기를 갱신한다
          example: 3600
        configVersion:
          type: string
          description: >-
            (gw/1.1+ 예약·v1.0 미사용) 현재 device 실효 중앙 config 버전 = 콘텐츠 해시(§7.8.4). device의
            appliedConfigVersion과 다르면 GET /v1/fleet/config로 다시 pull하라는 신호
          example: sha256:9f2a7c1b3d8e...

    # 중앙 Config (§7.8.4)
    FleetConfig:
      type: object
      required: [ config, configVersion ]
      description: >-
        (gw/1.1+ 예약·v1.0 미사용) device의 실효 중앙 config(§7.8.4). GW가 키별 가장 구체 스코프 우선(device > clinic > region > global, override 병합)으로 해석한 결과.
      properties:
        config:
          type: object
          additionalProperties: true
          description: >-
            실효 config 맵 — 키(gw.*/device.*)→값(스칼라/객체). 형식·키 레지스트리=design/db-jsonb-fields.md#config
          example: { gw.heartbeat.interval_seconds: 3600, gw.log.level: info }
        configVersion:
          type: string
          description: >-
            실효 config 버전 = 콘텐츠 해시(기여 (config_key,config_value,행 version) 정렬·canonical JSON의 SHA-256
            hex, §7.8.4). device는 이를 appliedConfigVersion으로 보고(drift 판정)
          example: sha256:9f2a7c1b3d8e...
    ConfigEntry:
      type: object
      required: [ scopeType, configKey, configValue ]
      description: '중앙 config 1항목 = (scope, key) → value(§7.8.4·config 테이블). 관리 API 입출력 단위.'
      properties:
        scopeType:
          type: string
          enum: [ global, region, clinic, device ]
          description: '부착 스코프. 실효값은 키별 device>clinic>region>global 우선'
          example: global
        scopeId:
          type: string
          nullable: true
          description: >-
            global=생략(null) / region=regionId / clinic=clinicId / device=deviceId (다형 참조·하드 FK 없음)
          example: null
        configKey:
          type: string
          description: '점 구분 소문자 키. gw.*(GW 소비)/device.*(전달). 예 gw.heartbeat.interval_seconds'
          example: gw.heartbeat.interval_seconds
        configValue:
          description: '값(스칼라 또는 객체). 키 레지스트리 스키마로 타입·범위 검증(PHI 금지)'
          example: 3600
        version:
          type: integer
          format: int64
          description: '행 버전(변경 시 증가) — 읽기 시 반환, 쓰기 시 GW가 증가시킴'
          example: 7
        createdAt:
          type: integer
          format: int64
          description: '생성 시각(Unix ms·서버 설정·읽기 전용)'
          example: 1720224000000
        updatedAt:
          type: integer
          format: int64
          description: '수정 시각(Unix ms)'
          example: 1720224000000
        updatedBy:
          type: string
          description: '변경 주체(audit actor, 예 user:entra-…)'
          example: user:entra-8f3a

    # 연동 대상(target) 통합 (§7.5·§7.6·§7.1.3) — 라우팅+아웃바운드 자격+인바운드 webhook 수신
    Target:
      type: object
      required: [ targetId, profile ]
      description: >-
        연동 대상(외부 서비스·내부 backend) **통합 레코드**(엔터티=target) — 라우팅+아웃바운드 자격+인바운드 webhook 수신을 한 레코드에(구 target_registry·connector·webhook_provider 병합). **target 하나 등록=1 레코드**. credential_ref·secret_ref는 KMS 참조만(원문 미노출). org_mapping·webhook_event·policy가 targetId를 참조. AXS=①②③ 다 채움 / 내부(cleverspace)=① 라우팅만.
      properties:
        targetId:
          type: string
          pattern: '^[a-z0-9_]+$'
          description: >-
            연동 대상 ID = Vatech-Target 값 = 서브도메인 라벨 = PK(정규 토큰 소문자). 예 axs·cleverspace
          example: axs
        # ── ① 라우팅 (모든 대상) ──
        host:
          type: string
          description: >-
            내부 매핑 host(클라이언트 비노출)·아웃바운드 base=https://{host}
          example: api.eu.axs.straumann.com
        profile:
          type: string
          enum: [ internal, external ]
          description: >-
            internal=B(내부) / external=C(외부)
          example: external
        connectTimeoutMs: { type: integer, description: 'GW→target 연결 대기 — GW 책임(D1, §7.5.4·R4)', example: 3000 }
        responseTimeoutMs: { type: integer, description: 'GW→target 응답 대기·초과 504(D2)', example: 10000 }
        totalDeadlineMs: { type: integer, description: '프록시 총 예산(D3, < 클라이언트 타임아웃)', example: 12000 }
        enabled: { type: boolean, example: true }
        # ── ② 아웃바운드 자격 (외부 C만·nullable) ──
        credentialRef:
          type: string
          nullable: true
          description: >-
            OAuth2 client 자격 KMS 참조(access token 아님·원문 미저장, §7.1.3). 내부(B)는 생략
          example: kms://alias/axs-oauth-client
        egressAllowlist:
          type: object
          nullable: true
          description: >-
            egress SSOT(#31) — hosts·cidrs 둘 다 비면 fail-closed(전면 거부). 외부 C만.
            형식=design/db-jsonb-fields.md#target
          properties:
            hosts:
              type: array
              items: { type: string }
              description: >-
                허용 FQDN
              example: [ api.eu.axs.straumann.com ]
            cidrs: { type: array, items: { type: string }, example: [] }
            ports: { type: array, items: { type: integer }, description: '생략 시 [443]', example: [ 443 ] }
            requireStaticEgressIp: { type: boolean, description: 'true면 고정 egress IP(NAT) 경유 강제', example: true }
        # ── ③ 인바운드 webhook (webhook 발신 대상만·nullable) ──
        inboundHost:
          type: string
          nullable: true
          description: >-
            전용 수신 호스트(Host/SNI 발신자 식별, §7.6.2). 미발신이면 생략
          example: axs.webhook.gw.vatech.com
        inboundRoute: { type: string, nullable: true, description: '등록 수신 경로(유연·발신 규약 수용)', example: /v1/webhooks/axs }
        sigScheme:
          type: string
          nullable: true
          description: >-
            서명 검증 스킴(인증). 알고리즘+서명헤더+인코딩+서명대상
          example: 'hmac-sha512'
        secretRef:
          type: string
          nullable: true
          description: >-
            HMAC 검증 시크릿 KMS 참조(원문 미저장)
          example: kms://alias/axs-webhook-hmac
        sourceIpAllowlist:
          type: array
          nullable: true
          items: { type: string, description: 'CIDR' }
          description: >-
            허용 소스 CIDR(옵션·방어심층·Host가 1차 식별)
          example: [ 203.0.113.0/24 ]
        eventIdPath: { type: string, nullable: true, description: 'payload에서 event_id(멱등) 추출 경로', example: $.messageId }
        orgIdPath:
          type: string
          nullable: true
          description: >-
            payload에서 externalOrgId 추출 경로
          example: $.organizationId
        eventTypePath:
          type: string
          nullable: true
          description: >-
            payload에서 event_type 추출 경로(target 어휘 verbatim·GW enum 아님)
          example: $.eventType
        createdAt: { type: integer, format: int64, description: '생성 시각(Unix ms·서버 설정·읽기 전용)', example: 1720224000000 }
        updatedAt: { type: integer, format: int64, description: '수정 시각(Unix ms·서버 설정·읽기 전용)', example: 1720310400000 }

    # Webhook
    WebhookEnvelope:
      type: object
      description: >-
        GW가 검증·라우팅에 쓰는 **논리(추출) 필드**를 예시로 정의(확정 계약 아님·§4.1.3). **실제 인바운드 본문은 target 원 스키마**라 필드명·구조가 다르며, GW가 `target.event_id_path`·`event_type_path`·`org_id_path`로 추출한다. 예: AXS는 `messageId`(→eventId)·`eventType`·최상위 `organizationId`(→org 라우팅 키)를 flat하게 보냄(아래 payload 래핑은 논리 예시). payload 본문은 opaque(GW 재정의 금지).
      required: [ eventId, eventType ]
      properties:
        eventId:
          type: string
          description: 멱등 키(중복 수신 dedup, §7.6.4)
          example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545
        eventType:
          type: string
          description: 이벤트 유형(분배 라우팅 키)
          example: patient.created
        payload:
          type: object
          description: target별 외부 스키마(④/AXS 스냅샷 참조). GW 재정의 금지.
          example: { organizationId: e407b34d-c4b0-4db3-bbcd-cc11770eae7b, patient: { id: a5437cb7-fffd-4cb2-8fdd-4063b5e43dae } }
    WebhookAck:
      type: object
      required: [ received ]
      description: 수신 ACK 본문(202). eventId 에코로 발신자 확인 편의.
      properties:
        received:
          type: boolean
          example: true
        eventId:
          type: string
          example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545

    WebhookEventState:
      type: string
      enum: [ received, dispatched, dead_letter ]
      description: >-
        webhook 처리 상태(DBML webhook_state). received=수신·미분배, dispatched=분배 완료, dead_letter=N회
        실패·DLQ
      example: dispatched

    WebhookPayloadView:
      type: object
      required: [ eventId, redacted, payload ]
      description: >-
        webhook 본문 열람 결과(break-glass·§7.6.3). GW가 리전 로컬 S3(claim-check)에서 읽어 PHI redact 후 반환한다. **Console 직접 S3 접근 금지**(GW 중개만).
      properties:
        eventId: { type: string, example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545 }
        redacted: { type: boolean, description: 'PHI 필드 마스킹 적용 여부(§7.6.3·redact 목록 #36)', example: true }
        payload:
          type: object
          additionalProperties: true
          description: 'redact 적용된 본문(target-owned·opaque). 마스킹된 PHI 필드는 값이 가려짐(전달 verbatim 본문은 불변)'
          example: { organizationId: e407b34d-c4b0-4db3-bbcd-cc11770eae7b, patient: { id: a5437cb7-fffd-4cb2-8fdd-4063b5e43dae, firstName: '***', lastName: '***' } }
        retrievedAt: { type: integer, format: int64, description: '열람 시각(Unix ms)', example: 1720224000000 }
    WebhookEvent:
      type: object
      description: >-
        webhook 이벤트 **PHI-free 운영 메타데이터**(webhook_event 테이블 매핑, §7.6). payload 본문은 리전 로컬 S3에만 두고 payloadRef로 참조(claim-check, 7/9 R7). 관계형 DB·본 응답에 본문 미포함.
      required: [ eventId, targetId, state, attempts, receivedAt ]
      properties:
        eventId: { type: string, description: '이벤트 식별자 = 멱등 키(dedup)', example: c2f8aaf5-d6d1-4f8c-a4a8-c4e9b3cb3545 }
        targetId: { type: string, description: '발신 target 라벨', example: axs }
        eventType:
          type: string
          nullable: true
          description: >-
            target 원어 event_type(verbatim·GW enum 아님·null 가능)
          example: patient.created
        externalOrgId: { type: string, nullable: true, description: '발신 org 식별자(분배 역조회 키·AXS=organizationId UUID). 추출 실패 시 null', example: e407b34d-c4b0-4db3-bbcd-cc11770eae7b }
        clinicId:
          type: string
          nullable: true
          description: >-
            해석된 대상 clinic(org_mapping 조회 결과·미해석 시 null)
          example: d3f1a9c07b6e4258af31c9d2e0b4a687
        region: { type: string, nullable: true, description: '해석된 대상 region(clinic 파생·미해석 시 null)', example: apne2 }
        payloadRef:
          type: string
          nullable: true
          description: >-
            본문 claim-check 참조(리전 로컬 S3·미보관 시 null)
          example: 's3://gw-webhook-payload-apne2/axs/c2f8aaf5.json'
        state: { $ref: '#/components/schemas/WebhookEventState' }
        dispatchTarget:
          type: string
          nullable: true
          description: >-
            구체적 분배 목적지 스냅샷 {channel}:{endpoint}
          example: 'mqtt_edge:gw/clinic/d3f1a9c07b6e4258af31c9d2e0b4a687/webhook'
        attempts: { type: integer, description: '분배 시도 횟수', example: 1 }
        lastError: { type: string, nullable: true, description: '마지막 분배 실패 사유(성공 시 null)', example: null }
        receivedAt: { type: integer, format: int64, description: '수신 시각(Unix ms·항상 존재)', example: 1720137600123 }
        dispatchedAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            분배 완료 시각(Unix ms·미분배 시 null)
          example: 1720137600456

    FleetState:
      type: object
      description: >-
        device별 관측 상태 스냅샷(fleet_state 테이블, §7.8). device push heartbeat로 갱신, 온라인/오프라인은
        last_heartbeat 임계 초과 파생.
      required: [ deviceId ]
      properties:
        deviceId: { type: string, description: 'device_id(PK·FK)', example: 01920a7b-3c4d-7e5f-8a90-1b2c3d4e5f60 }
        lastHeartbeat:
          type: integer
          format: int64
          description: >-
            마지막 heartbeat 수신 시각(Unix ms). device→GW push(§7.8.1)
          example: 1720224000000
        appVersion: { type: string, nullable: true, description: 'device가 heartbeat로 보고한 마지막 SW 버전(fleet_state.app_version·롤아웃/호환성 가시성). 미보고 시 null', example: 6.3.1.3 }
        os: { type: string, nullable: true, description: 'device(EzServer) OS(fleet_state.os·heartbeat 보고·verbatim). 미보고 시 null', example: Windows/11 }
        clinicId: { type: string, nullable: true, description: '소속 clinic(device.clinic_id 조인·파생·저장 컬럼 아님). clinic-less면 null', example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
        online:
          type: boolean
          description: >-
            파생 상태 — last_heartbeat이 임계(권장 주기 × gw.heartbeat.offline_threshold_multiplier·§7.8.1) 내면 true. staleOnly 필터는 online=false(정체) 대상
          example: true

    ClientInventory:
      type: object
      required: [ clinicId, product, swVersion, firstSeen, lastSeen ]
      description: >-
        앞단 클라이언트 SW 인벤토리 항목(client_inventory·§7.8.5·FR-FLEET-06). GW가 요청의 `Vatech-*` 헤더에서 관측한 **originator** SW(CleverOne 등). **식별 id 없음** → (clinicId, product, swVersion, os) 튜플이 식별키다. **대수가 아니라 버전 presence + recency**(lastSeen 정체=업그레이드/제거 추정·같은 버전 여러 PC는 한 항목으로 합쳐짐). 클라 주장값(비인증·관측용·authz 아님). EzServer 자기 SW/OS는 fleet_state(§7.8.1).
      properties:
        clinicId: { type: string, description: 'Vatech-Clinic-Id(소속 클리닉)', example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
        product: { type: string, description: 'Vatech-Product(originator)', example: CleverOne }
        swVersion: { type: string, description: 'Vatech-Version(semver)', example: 1.5.5 }
        os: { type: string, nullable: true, description: 'Vatech-OS 원문 그대로(미파싱). 미보고 시 null', example: Windows/11 }
        userAgent: { type: string, nullable: true, description: 'User-Agent 원문(최근 관측)', example: EzServer/6.5.0 }
        viaDeviceId: { type: string, nullable: true, description: '관측 경로 EzServer(Vatech-Via·최근·v1.0은 clinic device와 1:1이라 파생)', example: 01920a7b-3c4d-7e5f-8a90-1b2c3d4e5f60 }
        firstSeen: { type: integer, format: int64, description: '이 튜플 최초 관측(Unix ms)', example: 1720137600000 }
        lastSeen: { type: integer, format: int64, description: '이 튜플 최근 관측(Unix ms)·정체=구버전 잔존/제거 추정', example: 1720224000000 }

    # 감사
    AuditLog:
      type: object
      description: 'append-only 감사 항목(audit_log 테이블 매핑, §7.9.3·FR-AUD-01). 조회 전용(write API 없음).'
      properties:
        id: { type: integer, format: int64, description: '감사 항목 식별자(자동 증가·페이지네이션/참조용)', example: 100237 }
        ts: { type: integer, format: int64, description: '발생 시각(Unix ms)', example: 1720137600123 }
        actor: { type: string, description: '행위자 — `type:id`(user/system/device)', example: user:entra-8f3a }
        action:
          type: string
          description: >-
            수행 동작 — `resource.verb` 규약(free string·GW enum 아님)
          example: region.change
        result: { type: string, enum: [ success, denied, failure ], description: 'DBML audit_result enum', example: success }
        beforeState:
          type: object
          nullable: true
          description: >-
            변경 전 상태(부분 스냅샷·전체 행 아님). update/delete 시 존재·create/상태없는 action은 null. **PHI·원문 secret 금지**(관리 리소스 값만·참조/마스킹·§6.4). 형식=db-jsonb#audit_log
          example: { region: apne2 }
        afterState:
          type: object
          nullable: true
          description: >-
            변경 후 상태(부분 스냅샷). create/update 시 존재·delete/상태없는 action은 null. **PHI·원문 secret 금지**(§6.4). 형식=db-jsonb#audit_log
          example: { region: use1 }
        sourceIp:
          type: string
          nullable: true
          description: '행위자 source IP(IPv4/IPv6·요청 유입 IP). system 주체는 null 가능'
          example: 203.0.113.7

    # 라우팅·분배 레지스트리 (DB가 보관하는 "어디로 분배" 지식)
    OrgMapping:
      type: object
      required: [ targetId, externalOrgId, clinicId ]
      properties:
        targetId: { type: string, description: '연동 대상(target) ID', example: axs }
        externalOrgId:
          type: string
          description: >-
            target(발신)의 org 식별자(AXS=organizationId·UUID, organization.yml). 실제 값은 7/9 R4 확정(#46)
          example: e407b34d-c4b0-4db3-bbcd-cc11770eae7b
        clinicId: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
        mappingVersion: { type: integer, description: '매핑 버전(변경마다 +1·캐시 무효화·CAS·§7.3.2)', example: 2 }
        createdAt: { type: integer, format: int64, description: '생성 시각(Unix ms·서버 설정·읽기 전용)', example: 1720224000000 }
        updatedAt: { type: integer, format: int64, description: '수정 시각(Unix ms·서버 설정·읽기 전용)', example: 1720310400000 }
      description: 'webhook 라우팅 키 — (targetId, externalOrgId) → clinicId → region'
    Policy:
      type: object
      required: [ scopeType, targetId ]
      description: >-
        정책(OPA 입력·policy 테이블 매핑, §7.5.3·FR-INT-03). GW deny-by-default라 허용을 명시.
        실효=device→clinic→global 합성. egress는 여기 아님(target.egressAllowlist, #31). **v1.0
        집행=coarse(target 사용 허용까지)** — allowedEndpoints·scopes 세분화는 gw/1.1+ 예약(작업·데이터 격리는
        AXS+Org-ID)
      properties:
        id: { type: string, description: '정책 id(GW 생성·불투명 surrogate)', example: pol_7f3a2b1c }
        scopeType:
          type: string
          enum: [ global, clinic, device ]
          description: >-
            부착 스코프. v1.0=clinic+global 사용
          example: clinic
        scopeId:
          type: string
          nullable: true
          description: >-
            global=생략(null) / clinic=clinicId / device=deviceId (다형 참조·하드 FK 없음)
          example: d3f1a9c07b6e4258af31c9d2e0b4a687
        targetId: { type: string, description: '적용 대상 target(=target.targetId)', example: axs }
        allowedEndpoints:
          type: array
          description: '허용 (method,path) 목록. 형식=design/db-jsonb-fields.md#policy'
          example: [ { methods: [ GET ], pathPattern: /v1/patients/** } ]
          items:
            type: object
            properties:
              methods: { type: array, items: { type: string } }
              pathPattern: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: >-
            허용 scope
          example: [ axs:patient.read, axs:study.write ]
        createdAt: { type: integer, format: int64, description: '생성 시각(Unix ms·서버 설정·읽기 전용)', example: 1720224000000 }
        updatedAt: { type: integer, format: int64, description: '수정 시각(Unix ms·서버 설정·읽기 전용)', example: 1720310400000 }
    Clinic:
      type: object
      description: >-
        clinic 레코드(region SSOT·§6.4.1). GET /v1/clinics/me(device self)·GET
        /v1/admin/clinics/{clinicId}(operator) 응답.
      properties:
        clinicId: { type: string, description: 'LMP 발급 Clinic-ID·32자(§1.4)', example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
        region: { type: string, description: '배정 리전(region_catalog.regionId)', example: apne2 }
        name: { type: string, nullable: true, example: ES Clinic }
        countryCode: { type: string, nullable: true, description: 'ISO 3166 Alpha-2(GW region과 별개)', example: KR }
        address: { type: string, nullable: true, example: '13, Samsung 1-ro 2-gil, Hwaseong-si' }
        phone: { type: string, nullable: true, example: '02-1234-5678' }
        website: { type: string, nullable: true, example: 'https://www.ewoosoft.com/' }
        mappingVersion: { type: integer, description: '캐시 무효화·drift 감지(§7.3.2)', example: 3 }
        createdAt: { type: integer, format: int64, example: 1720137600000 }
        updatedAt: { type: integer, format: int64, example: 1720224000000 }
    ClinicRegistration:
      type: object
      required: [ clinicId, region ]
      properties:
        clinicId: { type: string, example: d3f1a9c07b6e4258af31c9d2e0b4a687 }
        region:
          type: string
          description: >-
            region(GW가 검증). 초기 region은 보통 enroll이 확립(GeoDNS 기본·C/S override); 본 입력은 운영자 교정 시 사용
          example: apne2
      description: '운영자(직원 IdP) 클리닉 교정·예외적 수동 등록 입력 — 주 생성 경로는 enroll(§2.3.1)'
    ClinicInfo:
      type: object
      description: >-
        LMP가 제공하는 clinic 표시·연락 정보(enroll 시 EzServer가 전달·§2.3.1, LMP 변경 시 PATCH /v1/clinics/me로 갱신).
        **수집 필드셋 확정(7/9 R3)**: name·countryCode·address·phone·website(LMP 전부). **enroll 시점 스냅샷 — LMP 변경 시 GW 자동 sync 안 함**(갱신=(재)enroll 또는 운영자 수동 교정). 저장 구조=고정 컬럼(jsonb 아님). 환자 PHI 아님(clinic 업무정보).
      properties:
        name: { type: string, description: '클리닉 표시명(LMP clinic.name)·Console 식별', example: ES Clinic }
        countryCode:
          type: string
          description: >-
            국가(LMP countyCode·ISO 3166 Alpha-2) — GW region(배포 리전)과 별개
          example: KR
        address:
          type: string
          nullable: true
          description: >-
            주소(LMP clinic.address)
          example: '13, Samsung 1-ro 2-gil, Hwaseong-si'
        phone: { type: string, nullable: true, description: '전화(LMP clinic.phone)', example: '02-1234-5678' }
        website:
          type: string
          nullable: true
          description: >-
            웹사이트(LMP clinic.website)
          example: 'https://www.ewoosoft.com/'
    OrgBinding:
      type: object
      required: [ targetId, externalOrgId ]
      properties:
        targetId: { type: string, description: '연동 대상(target) ID', example: axs }
        externalOrgId:
          type: string
          description: >-
            target(발신) Org-ID(AXS=organizationId·UUID, organization.yml). 실제 값은 7/9 R4 확정(#46)
          example: e407b34d-c4b0-4db3-bbcd-cc11770eae7b
      description: '외부 연동 연결 시 target별 Org-ID 등록 → org_mapping(webhook 라우팅 키)'
    Region:
      type: object
      required: [ regionId, status ]
      properties:
        regionId: { type: string, description: '예 apne2(서울), use1(미주)', example: apne2 }
        displayName: { type: string, example: 서울 }
        endpoint: { type: string, example: https://apne2.internal.gw.vatech.com }
        status: { type: string, enum: [ active, draining, planned ], example: active }
        isDefault: { type: boolean, example: true }
        createdAt: { type: integer, format: int64, description: '생성 시각(Unix ms·서버 설정·읽기 전용)', example: 1720224000000 }
        updatedAt: { type: integer, format: int64, description: '수정 시각(Unix ms·서버 설정·읽기 전용)', example: 1720310400000 }
      description: 'GW 운영 리전(GET /v1/regions). region_catalog 테이블 매핑'
    ProxyError:
      type: object
      required: [ errorCode, origin ]
      properties:
        errorCode:
          type: string
          enum: [ TARGET_UNREACHABLE, TARGET_TIMEOUT, TARGET_UNAVAILABLE ]
          description: '502 연결 실패 / 504 deadline 초과 / 503 서킷·일시불가(§7.7.4)'
          example: TARGET_TIMEOUT
        origin:
          type: string
          enum: [ gateway ]
          description: >-
            GW가 생성한 오류임을 표시(헤더 Vatech-Error-Origin: gateway와 동일). target 자체 4xx/5xx는 본 스키마를 쓰지 않고
            원응답을 verbatim 통과(origin: target)
          example: gateway
        targetId: { type: string, description: '실패한 target 서브도메인 라벨(논리 ID)', example: axs }
        retryAfter: { type: integer, description: '503 시 재시도 권고(초)', example: 30 }
        message: { type: string, example: target response deadline exceeded }
      description: >-
        GW 생성 프록시 오류 본문(502/503/504). target 응답은 verbatim 통과라 이 스키마 미적용(§7.5.4·§7.7.4)
