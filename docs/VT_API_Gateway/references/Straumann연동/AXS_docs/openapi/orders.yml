openapi: 3.0.3
info:
    title: Orders
    version: v1
    description: |-
        Straumann® AXS Lab Orders manages the end-to-end lifecycle of a lab order ensuring faster validation and seamless communication between clinics and labs. 
        
        In addition, with Straumann® AXS Order Integrator service, we have a place where all AXS orders are displayed unified and with a speed up search of all orders generated.
    license:
        name: Straumann
        url: https://axs.straumann.com
servers:
    - url: https://ppr.api.us.axs.straumann.com
    - url: https://ppr.api.eu.axs.straumann.com
    - url: PRODUCTION - https://api.us.axs.straumann.com
      description: Productive environment usage only. Not for testing
    - url: PRODUCTION - https://api.eu.axs.straumann.com
      description: Productive environment usage only. Not for testing
tags:
    - name: Order management
security:
    - httpBasic: []
    - bearerAuth: []
paths:
    /v1/orders/create-order:
        post:
            tags:
                - Order management
            summary: Create Lab Order
            description: Create a lab order without a Straumann® device
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: createLabOrder
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LabOrderCreationRequestPublicDto"
            responses:
                '200':
                    description: "Request was fulfilled successfully."
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderCreationResponseDto"
                '400':
                    description: "Bad Request"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
                '403':
                    description: "Forbidden"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
                '404':
                    description: "Not Found"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
                '409':
                    description: "Conflict"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
                '413':
                    description: "Payload too large"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
                '500':
                    description: "Internal Server Error"
                    content:
                        "*/*":
                            schema:
                                $ref: "#/components/schemas/LabOrderErrorDTO"
    /v1/orders/{orderId}/sending:
        post:
            tags:
                - Order management
            summary: Send Lab Order
            description: Send a lab order to another organization, usually a laboratory.
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: sendLabOrder
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: orderId
                  in: path
                  description: Unique identifier of the order.
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LabOrderSendingRequestDto'
                required: true
            responses:
                '200':
                    description: Request was fulfilled successfully.
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderSendingResponseDto'
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
    /v1/orders/{orderId}:
        delete:
            tags:
                - Order management
            summary: Delete Lab Order
            description: Delete a lab order by ID.
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: deleteLabOrder
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: orderId
                  in: path
                  description: Unique identifier of the order.
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '204':
                    description: Request was fulfilled successfully.
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
        get:
            tags:
                - Order management
            summary: Get order details
            description: Get order details by ID.
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: getLabOrder
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: orderId
                  in: path
                  description: Unique identifier of the order.
                  required: true
                  schema:
                      type: string
                      format: uuid
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            responses:
                '200':
                    description: Request was fulfilled successfully.
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderDetailPublicDto'
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/LabOrderErrorDTO'
    /v1/orders/search:
        get:
            tags:
                - Order management
            summary: Search orders
            description: Get all orders paginated with the possibility of using filters
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: searchOrders
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: lastElementPage
                  in: query
                  description: Cursor or ID of the last element from the previous page for pagination.
                  required: false
                  schema:
                      type: string
                - name: searchBoxText
                  in: query
                  required: false
                  schema:
                      type: string
                      minLength: 3
                      description: Text to search across multiple fields. Empty string or at least 3 characters.
                - name: orderStatus
                  in: query
                  description: Filter by order status.
                  required: false
                  schema:
                      type: string
                      enum:
                          - CANCELED
                          - CLOSED
                          - COMMON STATUS
                          - DESIGN
                          - DRAFT
                          - IN PROGRESS
                          - IN VALIDATION
                          - MANUFACTURING
                          - ORDER VALIDATION
                          - READY TO SEND
                          - REJECTED
                          - SCAN
                          - SHIPPED
                          - SHIPPING
                          - TREATMENT PLAN
                          - UPLOADING
                          - UPLOAD UNSUCCESSFUL
                          - IN_REVIEW
                          - APPROVED
                          - PRODUCTION
                          - DELETED
                - name: productOrderId
                  in: query
                  description: Filter by the order unique identifier.
                  required: false
                  schema:
                      type: string
            responses:
                '200':
                    description: OK
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/GetGenericSearchOrdersIntegratorResponseDto'
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '422':
                    description: Unprocessable Entity
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/error'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
    /v1/orders/{id}/file/search:
        get:
            tags:
                - Order management
            summary: Search order files
            description: Get all the files of an order
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: searchOrderFiles
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: id
                  in: path
                  description: Unique identifier of the order.
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: OK
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/GetOrderFileInfoResponseDTO'
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '422':
                    description: Unprocessable Entity
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/error'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
    /v1/orders/{id}/file/download:
        get:
            tags:
                - Order management
            summary: Download order files
            description: Download all files as a zip from an order
            servers:
                - url: https://ppr.api.us.axs.straumann.com
            operationId: getOrderFiles
            parameters:
                - $ref: '#/components/parameters/AcceptHeader'
                - $ref: '#/components/parameters/ContentTypeHeader'
                - $ref: '#/components/parameters/OrganizationIdHeader'
                - name: id
                  in: path
                  description: Unique identifier of the order.
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: OK
                    content:
                        '*/*':
                            schema:
                                type: array
                                items:
                                    type: string
                                    format: byte
                '400':
                    description: Bad Request
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '403':
                    description: Forbidden
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Not Found
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '409':
                    description: Conflict
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '413':
                    description: Payload Too Large
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '422':
                    description: Unprocessable Entity
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/error'
                '500':
                    description: Internal Server Error
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
components:
    securitySchemes:
        httpBasic:
            type: http
            scheme: basic
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    parameters:
        AcceptHeader:
            in: header
            name: Accept
            required: true
            schema:
                type: string
                default: "*/*"
        ContentTypeHeader:
            in: header
            name: Content-Type
            required: true
            schema:
                type: string
                default: "application/json"
        OrganizationIdHeader:
            in: header
            name: Organization-ID
            required: true
            schema:
                type: string
                format: uuid
                description: Unique identifier of the organization.
                example: "a3f1c9d2-4b5e-4e6a-9f2c-1d2f3e4b5c6d"
    schemas:
        ErrorDTO:
            type: object
            properties:
                status:
                    type: integer
                    format: int32
                reason:
                    type: string
                code:
                    type: string
                message:
                    type: string
                messageKey:
                    type: string
                occurredAt:
                    type: string
                    format: date-time
        LabOrderSendingRequestDto:
            type: object
            required:
                - labOrganizationId
            properties:
                labOrganizationId:
                    type: string
                    format: uuid
                    description: Unique identifier of the organization you want to send the order to.
                    example: "a3f1c9d2-4b5e-4e6a-9f2c-1d2f3e4b5c6d"
        LabOrderSendingResponseDto:
            type: object
            properties:
                orderId:
                    type: string
                    format: uuid
                    description: Unique identifier of the order sent.
                    example: "63ac754a-2c0b-4536-9e9d-9fc00262a846"
