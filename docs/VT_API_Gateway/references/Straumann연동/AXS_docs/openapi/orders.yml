                    type: string
                    format: date
                    description: Expected date to have the order completed.
                    example: "2025-03-19"
                patient:
                    $ref: "#/components/schemas/PatientPublicDto"
                status:
                    $ref: "#/components/schemas/LabOrderStatusDto"
