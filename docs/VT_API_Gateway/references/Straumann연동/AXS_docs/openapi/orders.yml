        UserRefDto:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: Unique identifier of a user.
                    example: "63ac754a-2c0b-4536-9e9d-9fc00262a846"
                title:
                    type: string
                    description: Title of the user.
                    example: "Dr."
                firstName:
                    type: string
                    description: First name of the user.
                    example: "Stephen"
                lastName:
                    type: string
                    description: Last name of the user.
                    example: "Jones"
                organization:
                    $ref: '#/components/schemas/OrganizationRefDto'
        CustomAbutmentDto:
            type: object
            properties:
                kit:
                    type: string
                    description: Abutment Kit.
                    example: "STMNZrO-Cro-RC"
                manufacturer:
                    type: string
                    description: Name of the manufacturer.
                    example: "Straumann/Bone Level"
        MaterialDto:
            type: object
            properties:
                value:
                    type: string
                    description: Value of the material.
                    example: "ZIRCONIA"
                    enum:
                        - ZIRCONIA
                        - METAL
                        - GLASS_CERAMIC
                        - POLYMER
        ProsthesisToothColorShadeDto:
            type: object
            properties:
                value:
                    type: string
                    description: The color shade value selected for the tooth prosthesis.
                    example: "A2"
                position:
                    type: string
                    description: The position or area of the tooth where the shade is applied.
                    example: "Cervical"
        ProsthesisToothColorShadeGuideDto:
            type: object
            properties:
                prosthesisToothColorShades:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProsthesisToothColorShadeDto'
                    description: List of color shades applied to different positions of the tooth.
                    example:
                        -   value: "A2"
                            position: "Cervical"
                guide:
                    type: string
                    description: Name of the shade guide used.
                    example: "VITA Classical"
        PatientDto:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: Unique identifier of a patient.
                    example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                customPatientId:
                    type: string
                    description: Patient ID created manually by the user or by default.
                    example: "PAT-2025-001"
                firstName:
                    type: string
                    description: Patient's first name.
                    example: "John"
                lastName:
                    type: string
                    description: Patient's last name.
                    example: "Doe"
                visibility:
                    type: string
                    description: Defines the visibility status of the patient in the context of the order.
                    enum:
                        - VISIBLE
                        - FORBIDDEN
                        - NOT_FOUND
                    example: "VISIBLE"
        RestorationDto:
            type: object
            required:
                - restorationSites
                - restorationType
            properties:
                restorationType:
                    type: string
                    description: Type of restoration.
                    enum:
                        - SINGLE
                        - BRIDGE
                material:
                    description: Material for the restoration.
                    items:
                        $ref: '#/components/schemas/MaterialDto'
                restorationSites:
                    type: array
                    description: List of tooth positions and indications of the restoration.
                    items:
                        $ref: '#/components/schemas/RestorationSiteDto'
        RestorationSiteDto:
            type: object
            required:
                - indication
            properties:
                toothPosition:
                    $ref: "#/components/schemas/ToothPositionDto"
                indication:
                    type: string
                    enum:
                        - ADVANCED_PONTIC
                        - ANATOMICAL_VENEER
                        - BAR_PILLAR
                        - BUCCAL_VENEER
                        - CLINICAL_COPING
                        - CODIAGNOSTIX_ABUTMENT
                        - CUSTOM_ABUTMENT
                        - CUSTOM_ABUTMENT_WITH_WAXING
                        - DENTURE
                        - DIAGNOSTIC_CROWN
                        - DIAGNOSTIC_PONTIC
                        - FULL_CROWN
                        - FULL_CROWN_ON_IMPLANT
                        - FULL_INLAY_CORE
                        - FULL_PONTIC
                        - INFIX_CROWN
                        - INFIX_PONTIC
                        - INLAY_CORE
                        - INLAY_ONLAY
                        - INLAY_SHELL
                        - LAVA_CUSTOM_ABUTMENT
                        - ONLAY
                        - PARTIAL
                        - PARTIAL_CROWN
                        - PARTIAL_DENTURE
                        - PONTIC
                        - PORCELAIN_CAP
                        - PORCELAIN_CAP_SUPPORT
                        - REDUCED_BUCCAL_VENEER
                        - REDUCED_CROWN
                        - REDUCED_CROWN_ON_IMPLANT
                        - REDUCED_INLAY_CORE
                        - REDUCED_VENEER
                        - SIMPLE_COPING
                        - SIMPLE_COPING_WITH_WAXING
                        - TELESCOP_COPING
                        - TELESCOPIC_CROWN_ON_IMPLANT
                        - VENEER
                        - VENEER_SHELL
                        - VESTIBULAR_INCRUSTATION
                        - VESTIBULAR_INCRUSTATION_ON_IMPLANT
                        - VESTIBULAR_INCRUSTATION_ON_PONTIC
                        - WAXING_COPY
                    description: Indication of the restoration site.
                    example: "PARTIAL_CROWN"
