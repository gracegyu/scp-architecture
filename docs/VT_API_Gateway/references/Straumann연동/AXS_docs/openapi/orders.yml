                    type: string
                    example: "Error on the Sirios Component"
                    description: Error and description
                note:
                    type: string
                    description: Additional notes related to the order.
                    example: "Please prioritize this case due to patient urgency."
                rejectionComment:
                    type: string
                    description: Comment explaining the reason for order rejection.
                    example: "Missing required documentation."
                trackingNumber:
                    type: string
                    description: Shipment tracking number for the order.
                    example: "TRK123456789"
                expectedDeliveryDate:
                    type: string
                    format: date
                    description: Estimated date of delivery.
                    example: "2025-03-15"
                deliveryStatus:
                    type: string
                    enum:
                        - PENDING
                        - INFO_RECEIVED
                        - IN_TRANSIT
                        - OUT_FOR_DELIVERY
                        - ATTEMPT_FAIL
                        - DELIVERED
                        - AVAILABLE_FOR_PICKUP
                        - EXCEPTION
                        - EXPIRED
                        - UNKNOWN
                    description: Current delivery status of the order.
                    example: "IN_TRANSIT"
                submittedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the order was submitted.
                    example: "2025-02-28T14:30:00Z"
                statusUpdatedAt:
                    type: string
                    format: date-time
                    description: Timestamp of the last status update.
                    example: "2025-03-01T09:00:00Z"
                createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the order was created.
                    example: "2025-02-27T10:00:00Z"
                updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp of the last update to the order.
                    example: "2025-03-01T09:00:00Z"
                implantSites:
                    type: array
                    items:
                        $ref: "#/components/schemas/ImplantSiteDto"
                restorations:
                    type: array
                    items:
                        $ref: "#/components/schemas/RestorationDto"
