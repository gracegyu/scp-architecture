# 빌드 호스트 ~/Documents/dtrack/docker-compose-dependency-track.yml 의 미러.
#
# ⚠ NVD_API_KEY 는 이 저장소(GitHub)에 두지 않아 ${NVD_API_KEY} 로 가렸다.
#   실제 값은 호스트 파일에만 있다. 복구 시 호스트 파일에서 채우거나 .env 로 주입할 것.
#
# 이 파일이 Dependency-Track 의 정본 배치다(compose project = dtrack).
# ~/Docker 쪽 파일이 아니다 — 그쪽에도 같은 container_name 으로 DT 정의가 있었고
# 실물과 달라서 2026-09-10 에 걷어냈다.

version: '3.8'

services:
  dependency-track-apiserver:
    image: dependencytrack/apiserver-fixed
    container_name: dependency-track-apiserver
    mem_limit: 8g
    ports:
      - "8081:8080"
    environment:
      - ALPINE_DATABASE_MODE=external
      - ALPINE_DATABASE_DRIVER=org.postgresql.Driver
      - ALPINE_DATABASE_URL=jdbc:postgresql://abc-wbs-postgres:5432/dependencytrack
      - ALPINE_DATABASE_DRIVER=org.postgresql.Driver
      - ALPINE_DATABASE_USERNAME=postgres
      - ALPINE_DATABASE_PASSWORD=postgres
      - ALPINE_DATABASE_POOL_ENABLED=true
      - ALPINE_DATABASE_POOL_MAX_SIZE=20
      - ALPINE_DATABASE_POOL_MIN_IDLE=10
      - DTRACK_NVD_ENABLED=true
      - DTRACK_NVD_API_KEY=${NVD_API_KEY}
      - DTRACK_NVD_BASE_URL=https://services.nvd.nist.gov/rest/json/cves/2.0
      - NVD_API_KEY=${NVD_API_KEY}
    volumes:
      - dependency-track_data:/data
    networks:
      - webnet
    restart: unless-stopped

  dependency-track:
    image: dependencytrack/frontend
    container_name: dependency-track
    ports:
      - '8080:8080'
    environment:
      - API_BASE_URL=http://dtrack.ewoosoft.com:8081
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      - dependency-track-apiserver

networks:
  webnet:
    external: true

volumes:
  dependency-track_data:
