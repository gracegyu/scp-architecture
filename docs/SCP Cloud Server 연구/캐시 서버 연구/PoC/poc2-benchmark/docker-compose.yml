version: '3.8'

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: poc2-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # PostgreSQL (메타데이터 저장소)
  postgres:
    image: postgres:15-alpine
    container_name: poc2-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: scp_user
      POSTGRES_PASSWORD: scp_password
      POSTGRES_DB: scp_cache
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (핫 데이터 캐시)
  redis:
    image: redis:7-alpine
    container_name: poc2-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 벤치마크 컨테이너
  benchmark:
    build: ./benchmark
    container_name: poc2-benchmark
    depends_on:
      - minio
      - postgres
      - redis
    volumes:
      - ./data/filesystem:/benchmark/cache
      - ./data/rocksdb:/benchmark/rocksdb
      - ./benchmark:/benchmark
      - ./results:/results
    environment:
      MINIO_ENDPOINT: minio:9000
      POSTGRES_HOST: postgres
      REDIS_HOST: redis

